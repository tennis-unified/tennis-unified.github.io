- Change the racet path at the contact
- Use figure 8 = change the force vector = accelerate quickly to regulate the transition smoothly & in control
- A car move straight = constant velocity
- a car turn at the curve to join highway
- Automatically increase the acceleration -> Driver must reduce speed or passenger gets thrown forward (like a tennis ball from racquet)

Trong forehand hien dai, duong vot khong phai la duong thang ma la so 8 nam ngang. Giai doan chuan bi - tha vot - keo len tao ra gia toc huong tam, giup tich luy nang luong dan hoi o co tay va canh tay.

Khi vao cua (chuyen huong tu drop len contact), co the tu dong tang toc do goc nhu o to vao khuc cua. Neu khong kiem soat, nang luong se bi nem ra ngoai - chinh la nguyen ly de tao ra RHS (racquet head speed) va giai phong toan bo nang luong tai diem cham bong.

Diem tiep xuc ly tuong truoc nguoi 30-40cm, di tu thap len cao de tao xoay. Sau tiep xuc, tha long hoan toan de vot di het hanh trinh - release all energy.
