<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #059669; stroke-width: 3; }
      .foot-toe { fill: #a7f3d0; stroke: #059669; stroke-width: 3; }
      .net { stroke: #94a3b8; stroke-width: 3.5; stroke-dasharray: 8 6; }
      .netlbl { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; text-anchor: middle; letter-spacing: .12em; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .power { stroke: #dc2626; stroke-width: 3.5; fill: none; marker-end: url(#ah-red); }
      .powerlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .dim { stroke: #0369a1; stroke-width: 1.8; marker-end: url(#ah-blue); marker-start: url(#ah-blue); }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .lift { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-dasharray: 4 4; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #10b981; }
        .foot-toe { fill: #065f46; stroke: #10b981; }
        .net { stroke: #64748b; }
        .netlbl { fill: #64748b; }
        .axis { stroke: #64748b; }
        .powerlbl { fill: #f87171; }
        .dim { stroke: #38bdf8; }
        .dimlbl { fill: #38bdf8; }
        .lift { stroke: #f87171; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
      }
    </style>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#dc2626"/></marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#0369a1"/></marker>
    <g id="foot3">
      <rect class="foot" x="-13" y="-34" width="26" height="64" rx="11"/>
      <rect class="foot-toe" x="-13" y="-34" width="26" height="16" rx="8"/>
    </g>
  </defs>

  <text class="h1" x="475" y="24">Cặp song sinh 2: ĐINH TẤN (cung bộ) ↔ TENNIS CLOSED STANCE — dồn về trước, lực thẳng · forward-weighted, linear power</text>

  <!-- LEFT: Front stance -->
  <rect class="panel" x="10" y="40" width="440" height="300" rx="14"/>
  <text class="ptitle" x="230" y="66">ĐINH TẤN / Cung bộ — Front stance (zenkutsu-dachi)</text>
  <line class="axis" x1="230" y1="90" x2="230" y2="310"/>
  <use href="#foot3" transform="translate(230,150) rotate(-15)"/>
  <use href="#foot3" transform="translate(230,270) rotate(8)"/>
  <path class="power" d="M 330 150 L 330 268"/>
  <text class="powerlbl" x="330" y="290">chân sau đẩy trọng tâm</text>
  <text class="powerlbl" x="330" y="306">về phía trước</text>
  <line class="dim" x1="160" y1="150" x2="160" y2="270"/>
  <text class="dimlbl" x="112" y="214">&gt; 2 vai</text>
  <text class="psub" x="230" y="330">Gối trước gập · chân sau thẳng · hông–vai vuông phía trước</text>

  <!-- RIGHT: Tennis closed stance -->
  <rect class="panel" x="500" y="40" width="440" height="300" rx="14"/>
  <text class="ptitle" x="720" y="66">TENNIS CLOSED STANCE — Tư thế đóng</text>
  <line class="net" x1="515" y1="120" x2="925" y2="120"/>
  <text class="netlbl" x="720" y="112">NET · LƯỚI</text>
  <line class="axis" x1="640" y1="150" x2="830" y2="290"/>
  <use href="#foot3" transform="translate(640,150) rotate(-12)"/>
  <use href="#foot3" transform="translate(830,290) rotate(-12)" opacity="0.5"/>
  <line class="lift" x1="830" y1="290" x2="880" y2="340"/>
  <text class="psub" x="860" y="330">gót sau rời sân</text>
  <path class="power" d="M 780 270 L 665 165"/>
  <text class="powerlbl" x="786" y="296">toàn trọng lượng</text>
  <text class="powerlbl" x="786" y="312">lên chân trước</text>
  <text class="psub" x="720" y="330">Hai chân chéo nhau trên trục trước–sau</text>

  <!-- Notes -->
  <g transform="translate(24,378)">
    <text class="note" x="0" y="14">✓ Cùng kiểu dồn lực: trọng tâm đẩy hết về phía trước — chân sau thẳng đẩy COG (Đinh tấn) / gót sau rời sân, trọn trọng lượng lên chân trước (closed stance).</text>
    <text class="note" x="0" y="38">✓ Cùng hướng lực: đi thẳng theo trục mục tiêu — “a great deal of power generation forward, but very little in any other direction”.</text>
    <text class="note" x="0" y="62">✓ Cùng vai trò: đều là thế “ít dùng” trong thực chiến hiện đại — đinh tấn chủ yếu là thế rèn căn chỉnh; closed stance là “the least commonly used of the three main stances”.</text>
  </g>
  <text class="psub" x="475" y="458">Committed forward · linear power · the stance you teach from and hit big with, not the one you live in</text>
</svg>
