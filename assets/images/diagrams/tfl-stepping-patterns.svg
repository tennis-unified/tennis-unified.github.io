<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 10.5px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.2; }
      .foot-toe { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.2; }
      .foot-a { fill: #dbeafe; stroke: #0369a1; stroke-width: 2.5; }
      .foot-at { fill: #93c5fd; stroke: #0369a1; stroke-width: 2.5; }
      .foot-b { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .foot-bt { fill: #fca5a5; stroke: #dc2626; stroke-width: 2.5; }
      .arrow { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#ah-pu); }
      .arrow2 { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#ah-gr); }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .lbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .stamp { stroke: #dc2626; stroke-width: 3; fill: none; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #64748b; }
        .foot-toe { fill: #475569; stroke: #64748b; }
        .foot-a { fill: #1e40af; stroke: #38bdf8; }
        .foot-at { fill: #1d4ed8; stroke: #38bdf8; }
        .foot-b { fill: #7f1d1d; stroke: #f87171; }
        .foot-bt { fill: #b91c1c; stroke: #f87171; }
        .arrow { stroke: #a78bfa; }
        .arrow2 { stroke: #34d399; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
        .lbl { fill: #e2e8f0; }
        .stamp { stroke: #f87171; }
      }
    </style>
    <marker id="ah-pu" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#7c3aed"/></marker>
    <marker id="ah-gr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#059669"/></marker>
    <g id="fa"><rect class="foot-a" x="-11" y="-28" width="22" height="52" rx="9"/><rect class="foot-at" x="-11" y="-28" width="22" height="14" rx="7"/></g>
    <g id="fb"><rect class="foot-b" x="-11" y="-28" width="22" height="52" rx="9"/><rect class="foot-bt" x="-11" y="-28" width="22" height="14" rx="7"/></g>
    <g id="fg"><rect class="foot" x="-11" y="-28" width="22" height="52" rx="9"/><rect class="foot-toe" x="-11" y="-28" width="22" height="14" rx="7"/></g>
  </defs>

  <text class="h1" x="475" y="26">BỘ PHÁP THÁI CỰC · Taiji stepping patterns — five named ways to cross ground</text>

  <!-- 1 Wave step -->
  <rect class="panel" x="10" y="42" width="290" height="200" rx="13"/>
  <text class="ptitle" x="155" y="64">1 · BƯỚC GỢN SÓNG · Wave Step</text>
  <use href="#fa" transform="translate(80,190)"/>
  <use href="#fb" transform="translate(150,190)"/>
  <use href="#fg" transform="translate(215,150)"/>
  <path class="arrow" d="M 150 156 C 172 132, 196 130, 214 146"/>
  <text class="lbl" x="155" y="216">rear foot rises close, toe touches, sole flattens, then the step lands</text>

  <!-- 2 Push-bounce -->
  <rect class="panel" x="312" y="42" width="290" height="200" rx="13"/>
  <text class="ptitle" x="457" y="64">2 · BƯỚC ĐẨY BẬT · Push-Bounce</text>
  <use href="#fa" transform="translate(382,190)"/>
  <use href="#fg" transform="translate(382,150)"/>
  <use href="#fb" transform="translate(452,190)"/>
  <path class="arrow2" d="M 382 160 L 382 196"/>
  <path class="arrow" d="M 452 158 C 480 132, 512 132, 540 154"/>
  <text class="lbl" x="457" y="216">the front foot withdraws as a feint, then stamps back down — the weight drop is the push</text>

  <!-- 3 Change step -->
  <rect class="panel" x="614" y="42" width="326" height="200" rx="13"/>
  <text class="ptitle" x="777" y="64">3 · BƯỚC ĐỔI · Change Step</text>
  <use href="#fa" transform="translate(700,190)"/>
  <use href="#fb" transform="translate(770,190)"/>
  <use href="#fg" transform="translate(742,140)"/>
  <path class="arrow" d="M 770 158 C 786 130, 764 122, 746 134"/>
  <text class="lbl" x="777" y="216">retreat with the lead foot, then step in at an angle with the rear — you arrive off the line</text>

  <!-- 4 Stamp -->
  <rect class="panel" x="10" y="256" width="290" height="200" rx="13"/>
  <text class="ptitle" x="155" y="278">4 · BƯỚC GIẬM · Stamp Step</text>
  <use href="#fa" transform="translate(115,404)"/>
  <use href="#fb" transform="translate(185,404)"/>
  <use href="#fg" transform="translate(115,352)"/>
  <path class="arrow" d="M 115 366 L 115 396"/>
  <path class="stamp" d="M 60 340 L 170 340"/>
  <text class="lbl" x="155" y="430">stamp the foot hard, then pass the shock up the leg into the hand</text>

  <!-- 5 Jump -->
  <rect class="panel" x="312" y="256" width="290" height="200" rx="13"/>
  <text class="ptitle" x="457" y="278">5 · BƯỚC NHẢY · Jump Step</text>
  <use href="#fa" transform="translate(400,404)"/>
  <use href="#fb" transform="translate(456,404)"/>
  <use href="#fg" transform="translate(540,362)"/>
  <path class="arrow" d="M 470 366 C 500 316, 526 320, 540 356"/>
  <text class="lbl" x="457" y="430">one leap opens or closes the whole gap — the surprise is the point</text>

  <!-- footer -->
  <rect class="panel" x="614" y="256" width="326" height="200" rx="13"/>
  <text class="ptitle" x="777" y="278">HOW THEY ARE BUILT</text>
  <text class="psub" x="777" y="304" text-anchor="start">· Scout with the toe going forward, with the heel going back.</text>
  <text class="psub" x="777" y="330" text-anchor="start">· Never let one foot sit directly in front of the other.</text>
  <text class="psub" x="777" y="356" text-anchor="start">· Weighted knee tracks over the toes of its own foot.</text>
  <text class="psub" x="777" y="382" text-anchor="start">· The step is the front edge of the waist turn, not a separate act.</text>
  <text class="psub" x="777" y="408" text-anchor="start">· All five vary in speed, force and distance — that is the drill.</text>
  <text class="psub" x="777" y="436">Bộ pháp chỉ có nghĩa khi nó phục vụ eo — the step serves the waist.</text>

  <text class="note" x="24" y="474">Sources: Paul Crompton, Tai Chi Combat (the five named steps) · Yang Chengfu, Thập Yếu · Yang Jwing-Ming, Tai Chi Martial Power.</text>
</svg>
