<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="cac-moi-quan-he-kamae.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .tori{fill:#0969da}
  .uke{fill:#1a7f37}
  .ft{fill:#e2e8f0;stroke:#64748b;stroke-width:2.5}
  .ft1{fill:#dbeafe;stroke:#0369a1;stroke-width:2.5}
  .arr{stroke:#cf222e;stroke-width:3;fill:none;marker-end:url(#ah)}
  .arrb{stroke:#0969da;stroke-width:3;fill:none;marker-end:url(#ahb)}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .tori{fill:#58a6ff}
    .uke{fill:#3fb950}
    .ft{fill:#21262d;stroke:#8b949e}
    .ft1{fill:#12385e;stroke:#58a6ff}
    .arr{stroke:#ff7b72}
    .arrb{stroke:#58a6ff}
  }
</style>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/></marker>
  <marker id="ahb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0969da"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="700">Aikido — Các mối quan hệ kamae</text>
<text class="mut" x="24" y="56" font-size="12">Nguồn: basic aikido stance and movements - katsujinken dojo</text>

<rect class="panel" x="20" y="76" width="310" height="250" rx="10"/>
<text class="acc" x="36" y="102" font-size="13" font-weight="700">AI-HANMI — THẾ TƯƠNG HỢP</text>
<text class="mut" x="36" y="120" font-size="10.5">hai người cùng chân ở trước</text>
<g transform="translate(120,200)"><circle class="tori" cx="0" cy="-52" r="11"/><line x1="0" y1="-41" x2="0" y2="-8" stroke="#0969da" stroke-width="3"/><g transform="rotate(-25)"><ellipse class="ft1" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft1" cx="0" cy="14" rx="8" ry="11"/></g><g transform="translate(-16,6) rotate(-25)"><ellipse class="ft" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft" cx="0" cy="14" rx="8" ry="11"/></g></g>
<g transform="translate(230,200)"><circle class="uke" cx="0" cy="-52" r="11"/><line x1="0" y1="-41" x2="0" y2="-8" stroke="#1a7f37" stroke-width="3"/><g transform="rotate(25)"><ellipse class="ft1" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft1" cx="0" cy="14" rx="8" ry="11"/></g><g transform="translate(16,6) rotate(25)"><ellipse class="ft" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft" cx="0" cy="14" rx="8" ry="11"/></g></g>
<path class="arrb" d="M120,300 L210,300"/>
<text class="acc" x="36" y="182" font-size="11.5">cùng chân trước — hai thế khớp nhau</text>
<text class="mut" x="36" y="318" font-size="11">→ nền tảng của OMOTE-WAZA: các kỹ thuật</text>
<text class="mut" x="36" y="333" font-size="11">mặt trước, bước vào phía trước của bạn tập.</text>

<rect class="panel" x="350" y="76" width="310" height="250" rx="10"/>
<text class="acc" x="366" y="102" font-size="13" font-weight="700">GYAKU-HANMI — THẾ ĐỐI NGHỊCH</text>
<text class="mut" x="366" y="120" font-size="10.5">hai người chân trước ngược nhau</text>
<g transform="translate(450,200)"><circle class="tori" cx="0" cy="-52" r="11"/><line x1="0" y1="-41" x2="0" y2="-8" stroke="#0969da" stroke-width="3"/><g transform="rotate(-25)"><ellipse class="ft1" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft1" cx="0" cy="14" rx="8" ry="11"/></g><g transform="translate(-16,6) rotate(-25)"><ellipse class="ft" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft" cx="0" cy="14" rx="8" ry="11"/></g></g>
<g transform="translate(560,200)"><circle class="uke" cx="0" cy="-52" r="11"/><line x1="0" y1="-41" x2="0" y2="-8" stroke="#1a7f37" stroke-width="3"/><g transform="rotate(-25)"><ellipse class="ft1" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft1" cx="0" cy="14" rx="8" ry="11"/></g><g transform="translate(16,6) rotate(-25)"><ellipse class="ft" cx="0" cy="-2" rx="10" ry="15"/><ellipse class="ft" cx="0" cy="14" rx="8" ry="11"/></g></g>
<path class="arrb" d="M450,300 L540,300"/>
<text class="acc" x="366" y="182" font-size="11.5">chân trước ngược nhau — hai thế đối nhau</text>
<text class="mut" x="366" y="318" font-size="11">→ buộc phải URA-WAZA: các kỹ thuật sau,</text>
<text class="mut" x="366" y="333" font-size="11">vào shikaku — điểm mù sau vai bạn tập.</text>

<rect class="panel" x="20" y="338" width="640" height="46" rx="10"/>
<text class="mut" x="36" y="358" font-size="11.5">Xanh lá = uke (bạn tập) · xanh dương = tori (người thực hành).</text>
<text class="mut" x="36" y="375" font-size="11.5">Trong quần vợt không có ai đứng đối diện — nhưng thói quen để ý chân dẫn của đối thủ vẫn chuyển giao trực tiếp.</text>
</svg>
