<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 10.5px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #059669; stroke-width: 2.5; }
      .foot-toe { fill: #a7f3d0; stroke: #059669; stroke-width: 2.5; }
      .net { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 7 5; }
      .netlbl { font-family: 'DM Sans', sans-serif; font-size: 9.5px; font-weight: 700; fill: #94a3b8; text-anchor: middle; letter-spacing: .12em; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .power { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#ah-red); }
      .powerlbl { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .rot { stroke: #059669; stroke-width: 2.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ah-green); }
      .dim { stroke: #0369a1; stroke-width: 1.6; marker-end: url(#ah-blue); marker-start: url(#ah-blue); }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .lift { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 3 3; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .legend { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #10b981; }
        .foot-toe { fill: #065f46; stroke: #10b981; }
        .net { stroke: #64748b; }
        .netlbl { fill: #64748b; }
        .axis { stroke: #64748b; }
        .dim { stroke: #38bdf8; }
        .dimlbl { fill: #38bdf8; }
        .h1 { fill: #34d399; }
        .legend { fill: #cbd5e1; }
      }
    </style>
    <marker id="ah-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#dc2626"/></marker>
    <marker id="ah-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#059669"/></marker>
    <marker id="ah-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#0369a1"/></marker>
    <g id="foot">
      <rect class="foot" x="-12" y="-32" width="24" height="60" rx="10"/>
      <rect class="foot-toe" x="-12" y="-32" width="24" height="15" rx="7"/>
    </g>
  </defs>

  <text class="h1" x="475" y="26">Năm thế đứng đối chiếu — hình học bàn chân (nhìn từ trên) · Five stances compared — bird&#x2019;s-eye foot geometry</text>

  <!-- Panel 1: Horse stance -->
  <rect class="panel" x="8" y="44" width="182" height="330" rx="12"/>
  <text class="ptitle" x="99" y="68">MÃ BỘ / Trung bình tấn</text>
  <text class="psub" x="99" y="84">Horse stance · kiba-dachi</text>
  <line class="axis" x1="24" y1="150" x2="174" y2="150"/>
  <use href="#foot" transform="translate(99,215)"/>
  <use href="#foot" transform="translate(45,215)"/>
  <use href="#foot" transform="translate(153,215)"/>
  <line class="dim" x1="45" y1="262" x2="153" y2="262"/>
  <text class="dimlbl" x="99" y="280">≈ 1.5–2 lần vai</text>
  <path class="power" d="M 99 185 L 99 118"/>
  <text class="powerlbl" x="99" y="108">hướng đối phương</text>
  <text class="psub" x="99" y="305">Chân song song, cùng trục ngang</text>
  <text class="psub" x="99" y="321">Feet parallel, same lateral axis</text>

  <!-- Panel 2: Front stance -->
  <rect class="panel" x="198" y="44" width="182" height="330" rx="12"/>
  <text class="ptitle" x="289" y="68">ĐINH TẤN / Cung bộ</text>
  <text class="psub" x="289" y="84">Front stance · zenkutsu-dachi</text>
  <line class="axis" x1="289" y1="100" x2="289" y2="300"/>
  <use href="#foot" transform="translate(289,165) rotate(-15)"/>
  <use href="#foot" transform="translate(289,275) rotate(8)"/>
  <line class="dim" x1="330" y1="165" x2="330" y2="275"/>
  <text class="dimlbl" x="289" y="300">&gt; 2 lần vai (dài)</text>
  <path class="power" d="M 289 120 L 289 100"/>
  <text class="psub" x="289" y="321">Trước sau một trục · lực đi thẳng</text>
  <text class="psub" x="289" y="337">Fore-aft axis · linear power</text>

  <!-- Panel 3: Tennis neutral/square -->
  <rect class="panel" x="388" y="44" width="182" height="330" rx="12"/>
  <text class="ptitle" x="479" y="68">TRUNG LẬP / VUÔNG</text>
  <text class="psub" x="479" y="84">Tennis neutral (square) stance</text>
  <line class="net" x1="398" y1="106" x2="560" y2="106"/>
  <text class="netlbl" x="479" y="99">NET · LƯỚI</text>
  <use href="#foot" transform="translate(466,175) rotate(90)"/>
  <use href="#foot" transform="translate(500,240) rotate(90)"/>
  <line class="dim" x1="466" y1="150" x2="500" y2="270"/>
  <text class="dimlbl" x="479" y="292">vuông góc 90° với lưới</text>
  <text class="psub" x="479" y="321">Chân vuông lưới · chuyển trọng tâm</text>
  <text class="psub" x="479" y="337">Perpendicular to net · weight shift</text>

  <!-- Panel 4: Tennis open -->
  <rect class="panel" x="578" y="44" width="182" height="330" rx="12"/>
  <text class="ptitle" x="669" y="68">TƯ THẾ MỞ</text>
  <text class="psub" x="669" y="84">Tennis open stance</text>
  <line class="net" x1="588" y1="106" x2="750" y2="106"/>
  <text class="netlbl" x="669" y="99">NET · LƯỚI</text>
  <use href="#foot" transform="translate(624,215)"/>
  <use href="#foot" transform="translate(714,215)"/>
  <path class="rot" d="M 640 160 A 40 40 0 0 1 700 160"/>
  <path class="rot" d="M 700 270 A 40 40 0 0 1 640 270"/>
  <text class="dimlbl" x="669" y="292">chân // lưới · xoay thân</text>
  <text class="psub" x="669" y="321">Feet parallel to net · coil/uncoil</text>
  <text class="psub" x="669" y="337">xoắn &amp; mở như lò xo</text>

  <!-- Panel 5: Tennis closed -->
  <rect class="panel" x="768" y="44" width="182" height="330" rx="12"/>
  <text class="ptitle" x="859" y="68">TƯ THẾ ĐÓNG</text>
  <text class="psub" x="859" y="84">Tennis closed stance</text>
  <line class="net" x1="778" y1="106" x2="940" y2="106"/>
  <text class="netlbl" x="859" y="99">NET · LƯỚI</text>
  <use href="#foot" transform="translate(830,160) rotate(-12)"/>
  <use href="#foot" transform="translate(892,255) rotate(-12)" opacity="0.55"/>
  <line class="axis" x1="830" y1="160" x2="892" y2="255"/>
  <path class="power" d="M 905 240 L 848 175"/>
  <text class="powerlbl" x="905" y="262">trọng lượng</text>
  <text class="psub" x="859" y="292">chân chéo · gót sau rời sân</text>
  <text class="psub" x="859" y="321">Diagonal feet · rear foot lifts</text>
  <text class="psub" x="859" y="337">toàn lực lên chân trước</text>

  <!-- Legend -->
  <g transform="translate(20,410)">
    <line class="power" x1="0" y1="8" x2="34" y2="8"/><text class="legend" x="42" y="12">Hướng lực / trọng lượng — power &amp; weight direction</text>
    <path class="rot" x1="0" y1="34" x2="34" y2="34"/><text class="legend" x="42" y="38">Xoay (coil/uncoil) — rotation</text>
    <line class="dim" x1="0" y1="60" x2="34" y2="60"/><text class="legend" x="42" y="64">Khoảng cách chân — foot spacing</text>
    <path class="lift" x1="0" y1="86" x2="34" y2="86"/><text class="legend" x="42" y="90">Chân nhấc / mờ — foot lifted or unweighted</text>
  </g>
  <text class="psub" x="475" y="530">Hình học là điểm then chốt: đôi chân quyết định hướng phát lực và mức độ ổn định · Geometry decides where power goes and how stable you are</text>
</svg>
