</style><rect class="bg" x="0" y="0" width="680" height="430"/><text class="ink" x="24" y="34" font-size="17" font-weight="700">Aikido — Irimi (tiến) &amp; Tenkan (xoay)</text><text class="mut" x="24" y="56" font-size="12">Nguồn: total aikido - nishio yurusu budo - takemusu vol.1 - advanced</text><rect class="panel" x="20" y="80" width="310" height="320" rx="10"/><text class="acc" x="40" y="106" font-size="14" font-weight="700">Irimi — bước vào khe hở</text><circle class="lnb" cx="110" cy="200" r="14" fill="none"/><line class="lnb" x1="110" y1="214" x2="110" y2="270"/><line class="lnb" x1="110" y1="270" x2="92" y2="320"/><line class="lnb" x1="110" y1="270" x2="128" y2="320"/><line class="acc2" x1="140" y1="200" x2="210" y2="200" stroke-width="3"/><text class="acc2" x="150" y="192" font-size="12">tấn công</text><circle class="dot" cx="270" cy="250" r="13"/><line class="lnb" x1="270" y1="263" x2="270" y2="312"/><line class="lnb" x1="270" y1="312" x2="255" y2="350"/><line class="lnb" x1="270" y1="312" x2="288" y2="350"/><path class="acc" d="M150 250 Q220 180 270 240" stroke-width="3" fill="none"/><text class="acc" x="180" y="160" font-size="12" font-weight="700">irimi (lệch đường)</text><rect class="panel" x="350" y="80" width="310" height="320" rx="10"/><text class="acc" x="370" y="106" font-size="14" font-weight="700">Tenkan — 180° trên chân trước</text><circle class="dot" cx="470" cy="200" r="13"/><line class="lnb" x1="470" y1="213" x2="470" y2="262"/><line class="lnb" x1="470" y1="262" x2="452" y2="312"/><line class="lnb" x1="470" y1="262" x2="488" y2="312"/><path class="acc" d="M470 200 A70 70 0 0 1 540 270" stroke-width="3" fill="none" stroke-dasharray="5 4"/><text class="acc" x="500" y="250" font-size="12" font-weight="700">xoay 180°</text><circle class="lnb" cx="560" cy="200" r="14" fill="none"/><text class="mut" x="370" y="360" font-size="12">Tiến khỏi đường thẳn, rồi xoay trụ —</text><text class="mut" x="370" y="376" font-size="12">lực bạn diễn được chuyển hướng, không đỡ.</text></svg>