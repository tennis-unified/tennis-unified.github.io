<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #059669; stroke-width: 3; }
      .foot-toe { fill: #a7f3d0; stroke: #059669; stroke-width: 3; }
      .net { stroke: #94a3b8; stroke-width: 3.5; stroke-dasharray: 8 6; }
      .netlbl { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; text-anchor: middle; letter-spacing: .12em; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .power { stroke: #dc2626; stroke-width: 3.5; fill: none; marker-end: url(#ah-red); }
      .powerlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .rot { stroke: #059669; stroke-width: 3; fill: none; stroke-dasharray: 6 5; marker-end: url(#ah-green); }
      .dim { stroke: #0369a1; stroke-width: 1.8; marker-end: url(#ah-blue); marker-start: url(#ah-blue); }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #10b981; }
        .foot-toe { fill: #065f46; stroke: #10b981; }
        .net { stroke: #64748b; }
        .netlbl { fill: #64748b; }
        .axis { stroke: #64748b; }
        .powerlbl { fill: #f87171; }
        .dim { stroke: #38bdf8; }
        .dimlbl { fill: #38bdf8; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
      }
    </style>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#dc2626"/></marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#059669"/></marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#0369a1"/></marker>
    <g id="foot2">
      <rect class="foot" x="-13" y="-34" width="26" height="64" rx="11"/>
      <rect class="foot-toe" x="-13" y="-34" width="26" height="16" rx="8"/>
    </g>
  </defs>

  <text class="h1" x="475" y="24">Cặp song sinh 1: MÃ BỘ (trung bình tấn) ↔ TENNIS OPEN STANCE — bệ ngang + xoay · lateral base + rotation</text>

  <!-- LEFT: Horse stance -->
  <rect class="panel" x="10" y="40" width="440" height="300" rx="14"/>
  <text class="ptitle" x="230" y="66">MÃ BỘ / Trung bình tấn — Horse stance (kiba-dachi)</text>
  <line class="axis" x1="40" y1="200" x2="420" y2="200"/>
  <use href="#foot2" transform="translate(230,290)"/>
  <use href="#foot2" transform="translate(160,290)"/>
  <use href="#foot2" transform="translate(300,290)"/>
  <line class="dim" x1="160" y1="80" x2="300" y2="80"/>
  <text class="dimlbl" x="230" y="70">≈ 1.5–2 lần bề rộng vai</text>
  <path class="power" d="M 230 240 L 230 120"/>
  <text class="powerlbl" x="230" y="112">đối phương / punch line</text>
  <path class="rot" d="M 150 210 A 60 60 0 0 1 310 210"/>
  <text class="psub" x="230" y="188">xoay hông phát lực (hip rotation)</text>
  <text class="psub" x="230" y="330">Đùi // mặt đất · chân song song · trọng lượng đều hai chân</text>

  <!-- RIGHT: Tennis open stance -->
  <rect class="panel" x="500" y="40" width="440" height="300" rx="14"/>
  <text class="ptitle" x="720" y="66">TENNIS OPEN STANCE — Tư thế mở</text>
  <line class="net" x1="515" y1="140" x2="925" y2="140"/>
  <text class="netlbl" x="720" y="132">NET · LƯỚI</text>
  <line class="axis" x1="520" y1="290" x2="920" y2="290"/>
  <use href="#foot2" transform="translate(720,290)"/>
  <use href="#foot2" transform="translate(620,290)"/>
  <use href="#foot2" transform="translate(820,290)"/>
  <path class="rot" d="M 615 250 A 100 100 0 0 1 825 250"/>
  <path class="rot" d="M 825 330 A 100 100 0 0 1 615 330"/>
  <text class="psub" x="720" y="235">coil (cuộn) → uncoil (mở) như lò xo</text>
  <text class="psub" x="720" y="358">Hai chân // lưới · xoay thân trên trục dọc tạo lực</text>

  <!-- Notes -->
  <g transform="translate(24,378)">
    <text class="note" x="0" y="14">✓ Cùng hình học: hai chân xếp ngang, song song, trên một trục vuông với hướng mục tiêu.</text>
    <text class="note" x="0" y="38">✓ Cùng cơ chế phát lực: xoay quanh trục dọc — xoay hông (Mã bộ) = xoắn &amp; mở thân (open stance).</text>
    <text class="note" x="0" y="62">✓ Cùng cái giá phải trả: bệ ngang tối đa, nhưng đẩy trọng tâm về trước kém — open stance “does not always allow for proper weight transfer and maintenance of balance”.</text>
  </g>
  <text class="psub" x="475" y="458">Same geometry · same rotation mechanism · same trade-off (stability and spin over forward drive)</text>
</svg>
