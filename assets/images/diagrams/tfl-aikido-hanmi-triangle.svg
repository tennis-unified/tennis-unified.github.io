<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #0369a1; stroke-width: 2.5; }
      .foot-toe { fill: #dbeafe; stroke: #0369a1; stroke-width: 2.5; }
      .tri { stroke: #7c3aed; stroke-width: 3; fill: rgba(124,58,237,.10); }
      .tri2 { stroke: #059669; stroke-width: 3; fill: rgba(5,150,105,.10); }
      .apex { fill: #7c3aed; }
      .mat { fill: rgba(148,163,184,.16); stroke: #94a3b8; stroke-width: 2; }
      .dim { stroke: #dc2626; stroke-width: 2.2; }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 800; fill: #dc2626; text-anchor: middle; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .lbl { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .lblL { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #334155; }
      .k { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      .center { stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 6 5; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #38bdf8; }
        .foot-toe { fill: #1e40af; stroke: #38bdf8; }
        .tri { stroke: #a78bfa; fill: rgba(167,139,250,.16); }
        .tri2 { stroke: #34d399; fill: rgba(52,211,153,.16); }
        .apex { fill: #a78bfa; }
        .mat { fill: rgba(100,116,139,.22); stroke: #64748b; }
        .dim { stroke: #f87171; }
        .dimlbl { fill: #f87171; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
        .lbl { fill: #e2e8f0; }
        .lblL { fill: #e2e8f0; }
        .k { fill: #34d399; }
        .center { stroke: #fbbf24; }
      }
    </style>
  </defs>

  <text class="h1" x="475" y="26">KAMAE · 構え — the ready stance, its triangle and its distance</text>

  <!-- Panel A: hanmi triangle -->
  <rect class="panel" x="10" y="44" width="330" height="330" rx="14"/>
  <text class="ptitle" x="175" y="70">構え · kamae — the triangular base</text>
  <g transform="translate(150,250) rotate(-90)"><rect class="foot" x="-15" y="-40" width="30" height="74" rx="13"/><rect class="foot-toe" x="-15" y="-40" width="30" height="19" rx="9"/></g>
  <g transform="translate(230,250)"><rect class="foot" x="-15" y="-40" width="30" height="74" rx="13"/><rect class="foot-toe" x="-15" y="-40" width="30" height="19" rx="9"/></g>
  <polygon class="tri" points="150,250 230,250 175,150"/>
  <circle class="apex" cx="175" cy="150" r="7"/>
  <text class="lbl" x="175" y="136">front hand — apex</text>
  <text class="lbl" x="175" y="278">rear foot = base · 60 / 40</text>
  <path class="center" d="M 190 320 L 190 100"/>
  <text class="lbl" x="256" y="320">centre line</text>
  <text class="psub" x="175" y="348">“Bàn chân sau tạo thành đáy của tam giác, bàn tay phía trước tạo thành đỉnh.”</text>
  <text class="psub" x="175" y="366">Feet on one line, rear foot square to the front foot.</text>

  <!-- Panel B: ai-hanmi vs gyaku-hanmi -->
  <rect class="panel" x="352" y="44" width="588" height="330" rx="14"/>
  <text class="ptitle" x="646" y="70">相半身 ai-hanmi · 逆半身 gyaku-hanmi — the two facing postures</text>

  <text class="k" x="500" y="102">AI-HANMI · 相半身 · “chéo nhau”</text>
  <g transform="translate(470,220) rotate(-90)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <g transform="translate(530,220)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <text class="lbl" x="500" y="150">Tori</text>
  <g transform="translate(470,300) rotate(-90)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <g transform="translate(530,300)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <text class="lbl" x="500" y="330">Uke</text>
  <text class="psub" x="500" y="358">same foot forward — mirror-identical</text>

  <text class="k" x="800" y="102">GYAKU-HANMI · 逆半身 · “đối xứng gương”</text>
  <g transform="translate(760,220) rotate(-90)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <g transform="translate(820,220)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <text class="lbl" x="800" y="150">Tori</text>
  <g transform="translate(760,300) rotate(90)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <g transform="translate(820,300) rotate(90)"><rect class="foot" x="-14" y="-36" width="28" height="66" rx="12"/><rect class="foot-toe" x="-14" y="-36" width="28" height="17" rx="8"/></g>
  <text class="lbl" x="800" y="330">Uke</text>
  <text class="psub" x="800" y="358">opposite feet forward — mirror image</text>

  <!-- Panel C: ma-ai -->
  <rect class="panel" x="10" y="390" width="930" height="112" rx="14"/>
  <text class="ptitle" x="475" y="414">間合い · MA-AI — the distance the feet must respect</text>
  <rect class="mat" x="150" y="446" width="620" height="42" rx="6"/>
  <line class="dim" x1="150" y1="467" x2="770" y2="467"/>
  <text class="dimlbl" x="460" y="461">1 tatami ≈ 1.8 m</text>
  <g transform="translate(180,467)"><rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/><rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/></g>
  <g transform="translate(740,467)"><rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/><rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/></g>
  <text class="lbl" x="180" y="436">Tori</text>
  <text class="lbl" x="740" y="436">Uke</text>
  <text class="psub" x="475" y="500">Too far to be struck, close enough that one honest step settles the technique — the whole art lives inside this gap.</text>

  <text class="note" x="24" y="524">Sources: Bodo Roedel, Aikido — the basics · Gozo Shioda, Total Aikido · Morihiro Saito, Takemusu Aikido Vol. 1.</text>
</svg>
