<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-label="taiji-root-xushi.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="460"/><text class="ink" x="24" y="36" font-size="17" font-weight="700">Thái Cực — Căn ở chân &amp; Hư / Thực (rỗng / đầy)</text><text class="mut" x="24" y="58" font-size="12">Nguồn: Thập yếu Dương Thành Phủ - Docherty - Crompton</text><rect class="panel" x="20" y="80" width="310" height="340" rx="10"/><text class="acc" x="40" y="106" font-size="14" font-weight="700">Căn (trung tâm ở chân)</text><path class="lnb" d="M150 130 L150 250 L120 330 H210" fill="none"/><rect class="lnb" x="110" y="328" width="80" height="14" rx="4"/><line class="acc" x1="150" y1="400" x2="150" y2="345" stroke-width="5"/><text class="acc" x="160" y="385" font-size="13" font-weight="700">hạ căn</text><text class="mut" x="40" y="420" font-size="12">Gối quá mũi; nặng 100/0 khi hạ căn.</text><text class="mut" x="40" y="440" font-size="12">Lực sinh từ mặt đất, không từ cơ.</text><rect class="panel" x="350" y="80" width="310" height="340" rx="10"/><text class="acc" x="370" y="106" font-size="14" font-weight="700">Hư / Thực — rỗng / đầy</text><line class="lnb" x1="420" y1="140" x2="420" y2="300" stroke-width="5"/><line class="dash" x1="560" y1="140" x2="560" y2="300" stroke-width="5"/><text class="ok" x="395" y="330" font-size="13" font-weight="700">thực / đầy (100%)</text><text class="mut" x="535" y="330" font-size="13" font-weight="700">hư / rỗng (0%)</text><line class="acc2" x1="490" y1="140" x2="490" y2="300" stroke-width="4"/><text class="acc2" x="470" y="175" font-size="12" font-weight="700">trùng</text><text class="acc2" x="470" y="192" font-size="12" font-weight="700">lượng = X</text><text class="mut" x="370" y="365" font-size="12">Một chân đầy, một chân rỗng = linh hoạt.</text><text class="mut" x="370" y="381" font-size="12">Cả hai 50/50 (trùng lượng) = tê cứng.</text><text class="mut" x="370" y="384" font-size="12">Đây là bài "nhón chân" trong tennis.</text></svg>