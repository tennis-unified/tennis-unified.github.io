<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-label="taiji-stepping-internal.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="470"/><text class="ink" x="24" y="34" font-size="17" font-weight="700">Taichi steps &amp; internal-family footwork</text><text class="mut" x="24" y="56" font-size="12">Sources: Crompton 5 steps - xingyi/bagua/chen</text><rect class="panel" x="30" y="80" width="118" height="90" rx="10"/><text class="acc" x="89" y="112" font-size="13" font-weight="700" text-anchor="middle">Wave</text><text class="mut" x="89" y="138" font-size="11" text-anchor="middle">weight rolls front->back</text><rect class="panel" x="158" y="80" width="118" height="90" rx="10"/><text class="acc" x="217" y="112" font-size="13" font-weight="700" text-anchor="middle">Push-bounce</text><text class="mut" x="217" y="138" font-size="11" text-anchor="middle">spring off the ball</text><rect class="panel" x="286" y="80" width="118" height="90" rx="10"/><text class="acc" x="345" y="112" font-size="13" font-weight="700" text-anchor="middle">Change</text><text class="mut" x="345" y="138" font-size="11" text-anchor="middle">shift without lifting</text><rect class="panel" x="414" y="80" width="118" height="90" rx="10"/><text class="acc" x="473" y="112" font-size="13" font-weight="700" text-anchor="middle">Stamp</text><text class="mut" x="473" y="138" font-size="11" text-anchor="middle">heavy downward root</text><rect class="panel" x="542" y="80" width="118" height="90" rx="10"/><text class="acc" x="601" y="112" font-size="13" font-weight="700" text-anchor="middle">Jump</text><text class="mut" x="601" y="138" font-size="11" text-anchor="middle">light, land soft</text><text class="ink" x="24" y="220" font-size="14" font-weight="700">Internal families</text><rect class="panel" x="20" y="232" width="200" height="200" rx="10"/><text class="acc" x="40" y="258" font-size="13" font-weight="700">Xingyi — san-ti</text><path class="lnb" d="M110 280 L110 360 L90 420 H140" fill="none"/><rect class="lnb" x="82" y="418" width="60" height="12" rx="3"/><text class="mut" x="40" y="452" font-size="11">3-body stance: 3/7 weight.</text><rect class="panel" x="240" y="232" width="200" height="200" rx="10"/><text class="acc" x="260" y="258" font-size="13" font-weight="700">Bagua — circle-walk</text><circle class="ln" cx="340" cy="330" r="55" fill="none"/><circle class="dot" cx="395" cy="330" r="5"/><circle class="dot" cx="357" cy="382" r="5"/><circle class="dot" cx="296" cy="362" r="5"/><circle class="dot" cx="296" cy="298" r="5"/><circle class="dot" cx="357" cy="278" r="5"/><text class="mut" x="260" y="452" font-size="11">Walk the circle, never cross feet.</text><rect class="panel" x="460" y="232" width="200" height="200" rx="10"/><text class="acc" x="480" y="258" font-size="13" font-weight="700">Chen — explosive stamp</text><line class="lnb" x1="560" y1="290" x2="560" y2="350"/><line class="acc" x1="560" y1="420" x2="560" y2="360" stroke-width="5"/><text class="acc2" x="540" y="345" font-size="13" font-weight="700">fa jin</text><text class="mut" x="480" y="452" font-size="11">Stamp down, issue power (fa jin).</text></svg>