<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #0369a1; stroke-width: 2.5; }
      .foot-toe { fill: #dbeafe; stroke: #0369a1; stroke-width: 2.5; }
      .foot-ghost { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 4; }
      .blade { stroke: #0f766e; stroke-width: 5; stroke-linecap: round; }
      .staff { stroke: #b45309; stroke-width: 6; stroke-linecap: round; }
      .dim { stroke: #dc2626; stroke-width: 2.2; }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 800; fill: #dc2626; text-anchor: middle; }
      .arrow { stroke: #dc2626; stroke-width: 2.6; fill: none; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .lbl { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .k { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      .step { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #38bdf8; }
        .foot-toe { fill: #1e40af; stroke: #38bdf8; }
        .foot-ghost { stroke: #64748b; }
        .blade { stroke: #5eead4; }
        .staff { stroke: #fbbf24; }
        .dim { stroke: #f87171; }
        .dimlbl { fill: #f87171; }
        .arrow { stroke: #f87171; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
        .lbl { fill: #e2e8f0; }
        .k { fill: #34d399; }
        .step { fill: #e2e8f0; }
      }
    </style>
    <marker id="wf-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text class="h1" x="475" y="26">WEAPONS FOOTWORK — what the sword and the staff teach the feet</text>

  <!-- Panel A: sword ma-ai -->
  <rect class="panel" x="10" y="44" width="460" height="250" rx="14"/>
  <text class="ptitle" x="240" y="70">一足一刀の間合い · issoku-ittō no maai — one step, one cut</text>

  <g transform="translate(140,205)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <g transform="translate(180,205)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <path class="blade" d="M 150 190 L 240 130"/>
  <text class="lbl" x="160" y="252">Tori</text>

  <g transform="translate(370,205)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <g transform="translate(410,205)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <path class="blade" d="M 400 190 L 310 130"/>
  <text class="lbl" x="390" y="252">Uke</text>

  <line class="dim" x1="205" y1="278" x2="365" y2="278"/>
  <text class="dimlbl" x="285" y="272">one honest step</text>
  <text class="psub" x="240" y="292">Far enough that neither is struck — close enough that a single step delivers the cut.</text>

  <!-- Panel B: suri-ashi -->
  <rect class="panel" x="482" y="44" width="458" height="250" rx="14"/>
  <text class="ptitle" x="711" y="70">摺り足 · suri-ashi — the sliding step</text>

  <text class="k" x="590" y="104">1 · REAR SLIDES UP</text>
  <g transform="translate(560,190)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <g transform="translate(618,190)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <path class="arrow" marker-end="url(#wf-r)" d="M 560 238 L 596 238"/>
  <text class="step" x="590" y="262">never lift, never cross</text>

  <text class="k" x="762" y="104">2 · FRONT EXTENDS</text>
  <g transform="translate(730,190)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <g transform="translate(778,190)">
    <rect class="foot-ghost" x="-13" y="-30" width="26" height="56" rx="11"/>
  </g>
  <g transform="translate(808,190)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <path class="arrow" marker-end="url(#wf-r)" d="M 778 238 L 800 238"/>
  <text class="step" x="769" y="262">the base never leaves the mat</text>

  <text class="psub" x="711" y="288">Feet stay in contact: the sole slides, so the head does not rise and the base is never surrendered.</text>

  <!-- Panel C: staff -->
  <rect class="panel" x="10" y="306" width="930" height="170" rx="14"/>
  <text class="ptitle" x="475" y="334">杖 · jō — the reach grows, the feet do not change</text>

  <g transform="translate(150,430)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <g transform="translate(190,430)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <path class="staff" d="M 165 412 L 330 412"/>
  <text class="lbl" x="170" y="478">Tori · hanmi, 60/40</text>

  <g transform="translate(390,430)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <g transform="translate(430,430)">
    <rect class="foot" x="-13" y="-30" width="26" height="56" rx="11"/>
    <rect class="foot-toe" x="-13" y="-30" width="26" height="15" rx="7"/>
  </g>
  <text class="lbl" x="410" y="478">Uke</text>

  <line class="dim" x1="330" y1="396" x2="378" y2="396"/>
  <text class="dimlbl" x="354" y="390">+reach</text>

  <text class="psub" x="700" y="400">The weapon adds reach, so ma-ai is measured from the tip, not the fist.</text>
  <text class="psub" x="700" y="422">Hanmi, the 60/40 split and suri-ashi stay exactly the same.</text>
  <text class="psub" x="700" y="444">Change the tool and you change the distance — never the feet.</text>

  <text class="note" x="24" y="516">Sources: Morihiro Saito, Traditional Aikido Vol. 2 — Sword &amp; Stick · Morihiro Saito, Takemusu Aikido Vol. 1 · Shoji Nishio, Aikido — Yurusu Budo.</text>
</svg>
