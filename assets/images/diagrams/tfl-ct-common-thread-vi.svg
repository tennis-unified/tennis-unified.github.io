<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-label="common-thread.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="560"/><text class="ink" x="24" y="38" font-size="19" font-weight="700">Thăng Bằng Động - Linh Hoạt - Phục Hồi</text><text class="mut" x="24" y="62" font-size="13">Sợi dây liên kết — Bộ pháp tennis đối chiếu bộ pháp Thái Cực &amp; võ thuật</text><rect class="panel" x="246" y="96" width="188" height="120" rx="10"/><text class="acc" x="340" y="126" font-size="16" text-anchor="middle" font-weight="700">Thăng Bằng Động</text><line class="ln" x1="246" y1="156" x2="228" y2="156"/><line class="ln" x1="434" y1="156" x2="452" y2="156"/><text class="ink" x="24" y="122" font-size="13">Bước đệm -> hạ đã thăng bằng;</text><text class="ink" x="24" y="139" font-size="13">chân rộng, trọng tâm thấp;</text><text class="ink" x="24" y="156" font-size="13">hồi phục về giữa</text><text class="ink" x="24" y="173" font-size="13">giữa các cú đánh.</text><text class="ink" x="454" y="122" font-size="13">Xoay trục từ tư thế mã bộ;</text><text class="ink" x="454" y="139" font-size="13">tam giác hanmi 60/40;</text><text class="ink" x="454" y="156" font-size="13">căn ở bàn chân, giữ</text><text class="ink" x="454" y="173" font-size="13">gối mềm.</text><rect class="panel" x="246" y="244" width="188" height="120" rx="10"/><text class="acc" x="340" y="274" font-size="16" text-anchor="middle" font-weight="700">Linh Hoạt</text><line class="ln" x1="246" y1="304" x2="228" y2="304"/><line class="ln" x1="434" y1="304" x2="452" y2="304"/><text class="ink" x="24" y="270" font-size="13">Cuộn &amp; mở hông;</text><text class="ink" x="24" y="287" font-size="13">bước ngang;</text><text class="ink" x="24" y="304" font-size="13">thế mở / thế đóng;</text><text class="ink" x="24" y="321" font-size="13">với tới, đừng dồn hết lực.</text><text class="ink" x="454" y="270" font-size="13">Xoay hông kiba->zenkutsu;</text><text class="ink" x="454" y="287" font-size="13">irimi tiến khỏi đường thẳn;</text><text class="ink" x="454" y="304" font-size="13">gợn sóng / đẩy bật</text><text class="ink" x="454" y="321" font-size="13">các bước Thái Cực.</text><rect class="panel" x="246" y="392" width="188" height="120" rx="10"/><text class="acc" x="340" y="422" font-size="16" text-anchor="middle" font-weight="700">Phục Hồi</text><line class="ln" x1="246" y1="452" x2="228" y2="452"/><line class="ln" x1="434" y1="452" x2="452" y2="452"/><text class="ink" x="24" y="418" font-size="13">Bước đầu về thế sẵn sàng;</text><text class="ink" x="24" y="435" font-size="13">tái căn giữa nhanh;</text><text class="ink" x="24" y="452" font-size="13">chủ động, đừng</text><text class="ink" x="24" y="469" font-size="13">chạy theo bóng.</text><text class="ink" x="454" y="418" font-size="13">Tenkan chuyển hướng 180°;</text><text class="ink" x="454" y="435" font-size="13">tai-sabaki né thân;</text><text class="ink" x="454" y="452" font-size="13">về kamae /</text><text class="ink" x="454" y="469" font-size="13">san-ti tức thì.</text><text class="mut" x="24" y="540" font-size="12">Luyện giống hệt nhau: chậm -> nhanh, nặng -> nhẹ, và luôn trở về trung tâm.</text></svg>