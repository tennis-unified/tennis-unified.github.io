<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.5; }
      .foot-toe { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.5; }
      .foot-full { fill: #fecaca; stroke: #dc2626; stroke-width: 3; }
      .foot-toe-full { fill: #dc2626; stroke: #dc2626; stroke-width: 3; }
      .foot-empty { fill: #ecfdf5; stroke: #10b981; stroke-width: 3; stroke-dasharray: 6 4; }
      .foot-toe-empty { fill: #d1fae5; stroke: #10b981; stroke-width: 3; stroke-dasharray: 6 4; }
      .ground { stroke: #94a3b8; stroke-width: 2.5; }
      .root { stroke: #7c3aed; stroke-width: 2.5; fill: none; stroke-dasharray: 4 4; }
      .dim { stroke: #0369a1; stroke-width: 1.8; }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .bad { stroke: #dc2626; stroke-width: 3; }
      .badlbl { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 800; fill: #dc2626; text-anchor: middle; }
      .goodlbl { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 800; fill: #059669; text-anchor: middle; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .lbl { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .pct { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .pct-e { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; fill: #059669; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #64748b; }
        .foot-toe { fill: #475569; stroke: #64748b; }
        .foot-full { fill: #7f1d1d; stroke: #f87171; }
        .foot-toe-full { fill: #dc2626; stroke: #f87171; }
        .foot-empty { fill: #064e3b; stroke: #34d399; }
        .foot-toe-empty { fill: #065f46; stroke: #34d399; }
        .ground { stroke: #64748b; }
        .root { stroke: #a78bfa; }
        .dim { stroke: #38bdf8; }
        .dimlbl { fill: #38bdf8; }
        .bad { stroke: #f87171; }
        .badlbl { fill: #f87171; }
        .goodlbl { fill: #34d399; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
        .lbl { fill: #e2e8f0; }
        .pct { fill: #f87171; }
        .pct-e { fill: #34d399; }
      }
    </style>
    <g id="fA">
      <rect class="foot" x="-14" y="-38" width="28" height="70" rx="12"/>
      <rect class="foot-toe" x="-14" y="-38" width="28" height="18" rx="9"/>
    </g>
  </defs>

  <text class="h1" x="475" y="26">PHÂN HƯ THỰC · Full and Empty — the weight map under every step</text>

  <!-- Panel A: 100/0 -->
  <rect class="panel" x="10" y="44" width="292" height="230" rx="14"/>
  <text class="ptitle" x="156" y="70">100 / 0 — single-weighted</text>
  <line class="ground" x1="40" y1="180" x2="272" y2="180"/>
  <g transform="translate(105,180)"><rect class="foot-full" x="-14" y="-38" width="28" height="70" rx="12"/><rect class="foot-toe-full" x="-14" y="-38" width="28" height="18" rx="9"/></g>
  <g transform="translate(205,180)"><rect class="foot-empty" x="-14" y="-38" width="28" height="70" rx="12"/><rect class="foot-toe-empty" x="-14" y="-38" width="28" height="18" rx="9"/></g>
  <path class="root" d="M 105 180 L 105 214"/>
  <path class="root" d="M 205 180 L 205 214"/>
  <text class="pct" x="105" y="232">100%</text>
  <text class="pct-e" x="205" y="232">0%</text>
  <text class="psub" x="156" y="256">Thực / Hư cleanly split — the empty foot can lift without a sound</text>

  <!-- Panel B: 70/30 -->
  <rect class="panel" x="322" y="44" width="292" height="230" rx="14"/>
  <text class="ptitle" x="468" y="70">70 / 30 — the bow stance (cung bộ)</text>
  <line class="ground" x1="352" y1="180" x2="584" y2="180"/>
  <g transform="translate(410,180) rotate(-8)"><rect class="foot-full" x="-14" y="-38" width="28" height="70" rx="12"/><rect class="foot-toe-full" x="-14" y="-38" width="28" height="18" rx="9"/></g>
  <g transform="translate(530,180) rotate(14)"><rect class="foot" x="-14" y="-38" width="28" height="70" rx="12"/><rect class="foot-toe" x="-14" y="-38" width="28" height="18" rx="9"/></g>
  <text class="pct" x="410" y="232">70%</text>
  <text class="dimlbl" x="530" y="232">30%</text>
  <text class="psub" x="468" y="256">Still one 實 one 虛 — never two feet doing the same job</text>

  <!-- Panel C: double-weighted error -->
  <rect class="panel" x="634" y="44" width="306" height="230" rx="14"/>
  <text class="ptitle" x="787" y="70">50 / 50 — the error</text>
  <line class="ground" x1="664" y1="180" x2="910" y2="180"/>
  <g transform="translate(727,180)"><rect class="foot" x="-14" y="-38" width="28" height="70" rx="12"/><rect class="foot-toe" x="-14" y="-38" width="28" height="18" rx="9"/></g>
  <g transform="translate(847,180)"><rect class="foot" x="-14" y="-38" width="28" height="70" rx="12"/><rect class="foot-toe" x="-14" y="-38" width="28" height="18" rx="9"/></g>
  <path class="bad" d="M 700 118 L 874 118"/>
  <text class="badlbl" x="787" y="108">雙重 · trùng lượng · DOUBLE-WEIGHTED</text>
  <text class="dimlbl" x="727" y="232">50%</text>
  <text class="dimlbl" x="847" y="232">50%</text>
  <text class="psub" x="787" y="256">“one of the worst errors” — neither foot can move, neither can push</text>

  <!-- Cross balance strip -->
  <rect class="panel" x="10" y="292" width="930" height="118" rx="14"/>
  <text class="ptitle" x="475" y="316">CÂN BẰNG CHÉO · Cross-balance — Zheng Manqing's diagonal jin</text>
  <g transform="translate(180,392)"><rect class="foot-full" x="-13" y="-32" width="26" height="60" rx="11"/><rect class="foot-toe-full" x="-13" y="-32" width="26" height="16" rx="8"/></g>
  <g transform="translate(330,392)"><rect class="foot-empty" x="-13" y="-32" width="26" height="60" rx="11"/><rect class="foot-toe-empty" x="-13" y="-32" width="26" height="16" rx="8"/></g>
  <text class="pct" x="180" y="424">實</text>
  <text class="pct-e" x="330" y="424">虛</text>
  <path class="root" d="M 180 356 C 260 336, 300 336, 360 348" />
  <circle cx="180" cy="356" r="6" fill="#dc2626"/>
  <circle cx="360" cy="348" r="6" fill="#059669"/>
  <text class="lbl" x="270" y="332">right hand ⟷ left leg share one jin</text>
  <text class="lbl" x="620" y="348">左腳 + 右手 = 實 · 右腳 + 左手 = 虛</text>
  <text class="lbl" x="620" y="372">Left foot + right hand are one 實; right foot + left hand are one 虛.</text>
  <text class="psub" x="620" y="396">If one half of the cross is full, the opposite half must be empty — otherwise the base is locked.</text>

  <text class="note" x="24" y="440">The first skill is not a step at all — it is telling your own weight apart. “Hư Thực là yếu nghĩa hàng đầu trong thuật Thái Cực Quyền.”</text>
  <text class="note" x="24" y="462">Sources: Yang Chengfu, Thập Yếu (Ten Essential Points), point 4 · Yang Jwing-Ming, Tai Chi Martial Power · Peng Jin in Tai Chi.</text>
  <text class="psub" x="475" y="508">Full and empty · 虛實分明 — distinguish weight, then muscle, then mind</text>
</svg>
