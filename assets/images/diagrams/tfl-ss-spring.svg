<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-label="tfl-ss-spring.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .gr{fill:#8c959f}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .gr{fill:#6e7681}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="356"/><text class="ink" x="24" y="34" font-size="17" font-weight="700">Load / Unload - the split step is a spring</text><text class="mut" x="24" y="55" font-size="12">A fast stretch-shortening cycle: sink to store, release to spend - a rebound, not a leap</text><rect class="panel" x="20" y="74" width="205" height="192" rx="10"/><rect class="panel" x="241" y="74" width="205" height="192" rx="10"/><rect class="panel" x="462" y="74" width="205" height="192" rx="10"/><text class="acc" x="122" y="96" font-size="12" font-weight="700" text-anchor="middle">1 LIFT - neutral</text><text class="acc" x="343" y="96" font-size="12" font-weight="700" text-anchor="middle">2 SOFT LANDING - store</text><text class="acc" x="564" y="96" font-size="12" font-weight="700" text-anchor="middle">3 RELEASE - first step</text><line class="ln" x1="30" y1="212" x2="657" y2="212"/>

<circle class="lnb" cx="122" cy="146" r="10"/><path class="lnb" d="M122 156 L122 184"/><path class="ln" d="M122 162 L106 154"/><path class="ln" d="M122 162 L138 154"/><path class="lnb" d="M122 184 L104 208"/><path class="lnb" d="M122 184 L140 208"/><line class="lnb" x1="98" y1="209" x2="110" y2="209"/><line class="lnb" x1="134" y1="209" x2="146" y2="209"/><text class="mut" x="122" y="232" font-size="10.5" text-anchor="middle">both feet light, options open;</text><text class="mut" x="122" y="245" font-size="10.5" text-anchor="middle">chest + hips square forward</text><text class="ok" x="122" y="262" font-size="10.5" font-weight="700" text-anchor="middle">balanced, uncommitted</text>

<circle class="lnb" cx="343" cy="162" r="10"/><path class="lnb" d="M343 172 L343 196"/><path class="ln" d="M343 178 L327 190"/><path class="ln" d="M343 178 L359 190"/><path class="lnb" d="M343 196 L334 208"/><path class="lnb" d="M334 208 L334 212"/><path class="lnb" d="M343 196 L352 208"/><path class="lnb" d="M352 208 L352 212"/><line class="lnb" x1="328" y1="213" x2="340" y2="213"/><line class="lnb" x2="358" x1="348" y1="213"/><path class="dash" d="M308 128 L308 168"/><path class="dash" d="M378 128 L378 168"/><path class="gr" d="M321 132 l0 14 -6 -6 z"/><path class="gr" d="M365 176 l0 14 -6 -6 z"/><text class="mut" x="343" y="232" font-size="10.5" text-anchor="middle">knee-soft dip, weight on the balls;</text><text class="mut" x="343" y="245" font-size="10.5" text-anchor="middle">eccentric load stores elastic energy</text><text class="ok" x="343" y="262" font-size="10.5" font-weight="700" text-anchor="middle">loaded - not spent</text>

<circle class="lnb" cx="548" cy="150" r="10"/><path class="lnb" d="M552 160 L558 184"/><path class="ln" d="M553 166 L539 174"/><path class="ln" d="M553 166 L567 158"/><path class="lnb" d="M558 184 L540 208"/><line class="lnb" x1="530" y1="209" x2="546" y2="209"/><path class="lnb" d="M558 184 L600 174"/><line class="lnb" x1="600" y1="175" x2="610" y2="172"/><path class="gr" d="M566 150 l12 6 -12 6 z"/><text class="mut" x="564" y="232" font-size="10.5" text-anchor="middle">back leg pushes off, front leg</text><text class="mut" x="564" y="245" font-size="10.5" text-anchor="middle">already reaching - energy released</text><text class="ok" x="564" y="262" font-size="10.5" font-weight="700" text-anchor="middle">redirect, do not re-start</text>

<path class="gr" d="M225 170 l14 6 -14 6 z"/><path class="gr" d="M446 170 l14 6 -14 6 z"/><text class="ink" x="24" y="298" font-size="12.5" font-weight="700">Why the dip must stay small and fast</text><text class="mut" x="24" y="318" font-size="11.5">A high jump throws the stored energy away before you can spend it. Contact time is ~0.1-0.2 s;</text><text class="mut" x="24" y="334" font-size="11.5">as the rally tightens the split shrinks toward a low shuffle. Time the lift to opponent contact.</text></svg>
