<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.5; }
      .foot-toe { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.5; }
      .foot1 { fill: #dbeafe; stroke: #0369a1; stroke-width: 3; }
      .foot1t { fill: #93c5fd; stroke: #0369a1; stroke-width: 3; }
      .ghost { fill: none; stroke: #cbd5e1; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .path { stroke: #dc2626; stroke-width: 3.5; fill: none; marker-end: url(#ah-r); }
      .pathT { stroke: #7c3aed; stroke-width: 3.5; fill: none; marker-end: url(#ah-p); }
      .pathlbl { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 800; fill: #dc2626; text-anchor: middle; }
      .pathlblT { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 800; fill: #7c3aed; text-anchor: middle; }
      .axis { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 5; }
      .lbl { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .uke { fill: #059669; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .k { font-family: 'Space Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #64748b; }
        .foot-toe { fill: #475569; stroke: #64748b; }
        .foot1 { fill: #1e40af; stroke: #38bdf8; }
        .foot1t { fill: #1d4ed8; stroke: #38bdf8; }
        .ghost { stroke: #475569; }
        .path { stroke: #f87171; }
        .pathT { stroke: #a78bfa; }
        .pathlbl { fill: #f87171; }
        .pathlblT { fill: #a78bfa; }
        .axis { stroke: #64748b; }
        .lbl { fill: #e2e8f0; }
        .uke { fill: #34d399; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
        .k { fill: #34d399; }
      }
    </style>
    <marker id="ah-r" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#dc2626"/></marker>
    <marker id="ah-p" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#7c3aed"/></marker>
    <g id="ft"><rect class="foot" x="-13" y="-34" width="26" height="62" rx="11"/><rect class="foot-toe" x="-13" y="-34" width="26" height="16" rx="8"/></g>
    <g id="ft1"><rect class="foot1" x="-13" y="-34" width="26" height="62" rx="11"/><rect class="foot1t" x="-13" y="-34" width="26" height="16" rx="8"/></g>
  </defs>

  <text class="h1" x="475" y="26">入り身 IRIMI · 転換 TENKAN — the two steps everything is built from</text>

  <!-- Panel A: irimi -->
  <rect class="panel" x="10" y="44" width="300" height="330" rx="14"/>
  <text class="ptitle" x="160" y="70">入り身 · IRIMI — enter</text>
  <line class="axis" x1="160" y1="100" x2="160" y2="350"/>
  <use href="#ft" transform="translate(130,300)"/>
  <use href="#ft" x="190" y="300"/>
  <use href="#ft1" transform="translate(160,190)"/>
  <path class="path" d="M 160 262 L 160 205"/>
  <text class="pathlbl" x="205" y="236">rear foot → front</text>
  <circle class="uke" cx="160" cy="112" r="9"/>
  <text class="lbl" x="160" y="98">Uke</text>
  <text class="psub" x="160" y="352">A straight step in, on the line, into the gap.</text>

  <!-- Panel B: tenkan -->
  <rect class="panel" x="322" y="44" width="300" height="330" rx="14"/>
  <text class="ptitle" x="472" y="70">転換 · TENKAN — turn</text>
  <line class="axis" x1="472" y1="100" x2="472" y2="350"/>
  <use href="#ft" transform="translate(472,300)"/>
  <use href="#ghost" transform="translate(472,236)" />
  <use href="#ft1" transform="translate(472,150)"/>
  <path class="pathT" d="M 472 300 C 560 290, 560 190, 486 155"/>
  <text class="pathlblT" x="566" y="230">180° on the front foot</text>
  <circle class="uke" cx="472" cy="112" r="9"/>
  <text class="lbl" x="472" y="98">Uke</text>
  <text class="psub" x="472" y="352">Looks circular — the feet still travel one straight line.</text>

  <!-- Panel C: tai sabaki -->
  <rect class="panel" x="634" y="44" width="306" height="330" rx="14"/>
  <text class="ptitle" x="787" y="70">体捌き · TAI-SABAKI = irimi + tenkan</text>
  <line class="axis" x1="787" y1="100" x2="787" y2="350"/>
  <use href="#ft" transform="translate(750,300)"/>
  <use href="#ft" transform="translate(824,300)"/>
  <use href="#ft1" transform="translate(787,230)"/>
  <path class="path" d="M 787 266 L 787 242"/>
  <use href="#ft1" transform="translate(787,150)"/>
  <path class="pathT" d="M 800 150 C 872 156, 872 214, 812 228"/>
  <text class="pathlbl" x="740" y="222">1 · enter</text>
  <text class="pathlblT" x="866" y="196">2 · turn</text>
  <circle class="uke" cx="787" cy="112" r="9"/>
  <text class="lbl" x="787" y="98">Uke</text>
  <text class="psub" x="787" y="352">One step, one turn — never a step and then a turn.</text>

  <text class="note" x="24" y="404">“動きは足に始まる” — the movement begins in the feet. In Aikido, hand movement always follows foot movement, never the reverse.</text>
  <text class="note" x="24" y="426">Irimi commits forward and takes the attacker's line; tenkan rotates out of it and re-faces. The pair is the alphabet of every technique.</text>
  <text class="note" x="24" y="448">Sources: Bodo Roedel, Aikido — the basics · Gozo Shioda, Total Aikido.</text>
  <text class="psub" x="475" y="466">入り身 · 転換 · 体捌き</text>
</svg>
