<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-label="tfl-ss-spring.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .gr{fill:#8c959f}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .gr{fill:#6e7681}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="356"/><text class="ink" x="24" y="34" font-size="17" font-weight="700">Nạp / Giải tải - bước tách như một lò xo</text><text class="mut" x="24" y="55" font-size="12">Một chu trình giãn-co nhanh: hạ để tích, nẩy để giải - một lần nẩy, không phải cú nhảy</text><rect class="panel" x="20" y="74" width="205" height="192" rx="10"/><rect class="panel" x="241" y="74" width="205" height="192" rx="10"/><rect class="panel" x="462" y="74" width="205" height="192" rx="10"/><text class="acc" x="122" y="96" font-size="12" font-weight="700" text-anchor="middle">1 NÂNG - trung lập</text><text class="acc" x="343" y="96" font-size="12" font-weight="700" text-anchor="middle">2 HẠ MỀM - tích lực</text><text class="acc" x="564" y="96" font-size="12" font-weight="700" text-anchor="middle">3 GIẢI TẢI - bước đầu</text><line class="ln" x1="30" y1="212" x2="657" y2="212"/>

<circle class="lnb" cx="122" cy="146" r="10"/><path class="lnb" d="M122 156 L122 184"/><path class="ln" d="M122 162 L106 154"/><path class="ln" d="M122 162 L138 154"/><path class="lnb" d="M122 184 L104 208"/><path class="lnb" d="M122 184 L140 208"/><line class="lnb" x1="98" y1="209" x2="110" y2="209"/><line class="lnb" x1="134" y1="209" x2="146" y2="209"/><text class="mut" x="122" y="232" font-size="10.5" text-anchor="middle">hai chân nhẹ, mọi hướng mở;</text><text class="mut" x="122" y="245" font-size="10.5" text-anchor="middle">ngực + hông vuông về trước</text><text class="ok" x="122" y="262" font-size="10.5" font-weight="700" text-anchor="middle">cân bằng, chưa chọn hướng</text>

<circle class="lnb" cx="343" cy="162" r="10"/><path class="lnb" d="M343 172 L343 196"/><path class="ln" d="M343 178 L327 190"/><path class="ln" d="M343 178 L359 190"/><path class="lnb" d="M343 196 L334 208"/><path class="lnb" d="M334 208 L334 212"/><path class="lnb" d="M343 196 L352 208"/><path class="lnb" d="M352 208 L352 212"/><line class="lnb" x1="328" y1="213" x2="340" y2="213"/><line class="lnb" x2="358" x1="348" y1="213"/><path class="dash" d="M308 128 L308 168"/><path class="dash" d="M378 128 L378 168"/><path class="gr" d="M321 132 l0 14 -6 -6 z"/><path class="gr" d="M365 176 l0 14 -6 -6 z"/><text class="mut" x="343" y="232" font-size="10.5" text-anchor="middle">gối mềm hạ, lực trên các đốt;</text><text class="mut" x="343" y="245" font-size="10.5" text-anchor="middle">gia tải hướng tâm tích lực đàn hồi</text><text class="ok" x="343" y="262" font-size="10.5" font-weight="700" text-anchor="middle">đã nạp - chưa tiêu</text>

<circle class="lnb" cx="548" cy="150" r="10"/><path class="lnb" d="M552 160 L558 184"/><path class="ln" d="M553 166 L539 174"/><path class="ln" d="M553 166 L567 158"/><path class="lnb" d="M558 184 L540 208"/><line class="lnb" x1="530" y1="209" x2="546" y2="209"/><path class="lnb" d="M558 184 L600 174"/><line class="lnb" x1="600" y1="175" x2="610" y2="172"/><path class="gr" d="M566 150 l12 6 -12 6 z"/><text class="mut" x="564" y="232" font-size="10.5" text-anchor="middle">chân sau đẩy, chân trước tới;</text><text class="mut" x="564" y="245" font-size="10.5" text-anchor="middle">đang tới - lực đã giải phóng</text><text class="ok" x="564" y="262" font-size="10.5" font-weight="700" text-anchor="middle">chuyển hướng, khởi động lại</text>

<path class="gr" d="M225 170 l14 6 -14 6 z"/><path class="gr" d="M446 170 l14 6 -14 6 z"/><text class="ink" x="24" y="298" font-size="12.5" font-weight="700">Vì sao độ hạ phải nhỏ và nhanh</text><text class="mut" x="24" y="318" font-size="11.5">Cú nhảy cao ném đi lực đã tích trước khi dùng. Chạm đất ~0,1-0,2 giây;</text><text class="mut" x="24" y="334" font-size="11.5">pha càng thì bước tách thu nhỏ thành bước lướt. Hãy nâng theo nhịp đối thủ chạm bóng.</text></svg>
