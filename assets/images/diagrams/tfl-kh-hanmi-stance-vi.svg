<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="ba-the-hanmi-co-ban.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ft1{fill:#dbeafe;stroke:#0369a1;stroke-width:2.5}
  .ft2{fill:#e2e8f0;stroke:#64748b;stroke-width:2.5}
  .ghost{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 4}
  .arr{stroke:#cf222e;stroke-width:3;fill:none;marker-end:url(#ah)}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ft1{fill:#12385e;stroke:#58a6ff}
    .ft2{fill:#21262d;stroke:#8b949e}
    .ghost{stroke:#484f58}
    .arr{stroke:#ff7b72}
  }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="700">Aikido — Ba thế đứng hanmi cơ bản</text>
<text class="mut" x="24" y="56" font-size="12">Nguồn: basic aikido stance and movements - katsujinken dojo</text>

<rect class="panel" x="20" y="76" width="208" height="250" rx="10"/>
<text class="acc" x="34" y="102" font-size="13" font-weight="700">1 · THẾ HÔNG NỬA CƠ BẢN</text>
<text class="mut" x="34" y="120" font-size="10.5">migi-hanmi — chân phải trước</text>
<g transform="translate(124,300) rotate(-90)"><ellipse class="ft1" cx="0" cy="-34" rx="12" ry="17"/><ellipse class="ft1" cx="0" cy="10" rx="9" ry="13"/></g>
<g transform="translate(84,238) rotate(-90)"><ellipse class="ft2" cx="0" cy="-34" rx="12" ry="17"/><ellipse class="ft2" cx="0" cy="10" rx="9" ry="13"/></g>
<path class="arr" d="M124,272 L124,210"/>
<text class="mut" x="34" y="318" font-size="10.5">Một chân trước, thân xoay ~45°,</text>
<text class="mut" x="34" y="333" font-size="10.5">đầu gối mềm — trọng lượng tâm dưới.</text>

<rect class="panel" x="236" y="76" width="208" height="250" rx="10"/>
<text class="acc" x="250" y="102" font-size="13" font-weight="700">2 · THẾ HÔNG NỬA MỞ</text>
<text class="mut" x="250" y="120" font-size="10.5">hai bàn chân xoay ra ngoài ~45°</text>
<g transform="translate(306,250) rotate(-135)"><ellipse class="ft1" cx="0" cy="-34" rx="12" ry="17"/><ellipse class="ft1" cx="0" cy="10" rx="9" ry="13"/></g>
<g transform="translate(370,250) rotate(-45)"><ellipse class="ft2" cx="0" cy="-34" rx="12" ry="17"/><ellipse class="ft2" cx="0" cy="10" rx="9" ry="13"/></g>
<path class="arr" d="M306,290 L368,292"/>
<text class="mut" x="250" y="318" font-size="10.5">Mở hơn thế cơ bản: hai chân</text>
<text class="mut" x="250" y="333" font-size="10.5">tạo góc rộng, hông mở hoàn toàn.</text>

<rect class="panel" x="452" y="76" width="208" height="250" rx="10"/>
<text class="acc" x="466" y="102" font-size="13" font-weight="700">3 · THẾ TAM GIÁC NGƯỢC</text>
<text class="mut" x="466" y="120" font-size="10.5">hidari-hanmi — chân trái trước</text>
<g transform="translate(556,300) rotate(-90)"><ellipse class="ft1" cx="0" cy="-34" rx="12" ry="17"/><ellipse class="ft1" cx="0" cy="10" rx="9" ry="13"/></g>
<g transform="translate(516,238) rotate(-160)"><ellipse class="ft2" cx="0" cy="-34" rx="12" ry="17"/><ellipse class="ft2" cx="0" cy="10" rx="9" ry="13"/></g>
<path class="arr" d="M551,296 L524,254"/>
<text class="mut" x="466" y="318" font-size="10.5">Chân trước tới, chân sau xoay ra —</text>
<text class="mut" x="466" y="333" font-size="10.5">bề mặt trước thu hẹp tối đa.</text>

<rect class="panel" x="20" y="338" width="640" height="46" rx="10"/>
<text class="ink" x="36" y="358" font-size="12" font-weight="700">Cả ba đều theo nguyên lý tam giác — sankaku-ho:</text>
<text class="mut" x="36" y="375" font-size="11.5">đáy là bàn chân sau, đỉnh là bàn tay trước; mọi ví dụ vẽ ở thế phải, thế trái là ảnh gương.</text>
</svg>
