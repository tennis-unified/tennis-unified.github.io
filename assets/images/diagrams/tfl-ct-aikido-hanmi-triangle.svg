<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-label="aikido-hanmi-triangle.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="430"/><text class="ink" x="24" y="36" font-size="17" font-weight="700">Aikido — Hanmi (kamae) triangle</text><text class="mut" x="24" y="58" font-size="12">Sources: roedel basics - total aikido (Shioda) - saito - advanced (Dang &amp; Seiser)</text><circle class="lnb" cx="300" cy="150" r="16" fill="none"/><line class="lnb" x1="300" y1="166" x2="300" y2="250"/><line class="lnb" x1="300" y1="250" x2="360" y2="340"/><line class="lnb" x1="300" y1="250" x2="240" y2="350"/><line class="lnb" x1="300" y1="185" x2="345" y2="205"/><line class="lnb" x1="300" y1="185" x2="258" y2="210"/><rect class="lnb" x="346" y="338" width="34" height="10" rx="3"/><rect class="lnb" x="222" y="348" width="34" height="10" rx="3"/><line class="acc" x1="363" y1="392" x2="363" y2="346" stroke-width="5"/><text class="acc" x="372" y="376" font-size="13" font-weight="700">60%</text><line class="mut" x1="239" y1="384" x2="239" y2="354" stroke-width="3"/><text class="mut" x="190" y="376" font-size="13" font-weight="700">40%</text><text class="ink" x="430" y="150" font-size="13">Front foot leads, rear</text><text class="ink" x="430" y="167" font-size="13">at ~45 deg. The body is</text><text class="ink" x="430" y="184" font-size="13">a triangle: stable,</text><text class="ink" x="430" y="201" font-size="13">mobile, never square.</text><text class="ink" x="430" y="218" font-size="13">Weight 60/40 lets you</text><text class="ink" x="430" y="235" font-size="13">pivot without stepping.</text><text class="ink" x="430" y="290" font-size="13">ai-hanmi: lead foot &amp;</text><text class="ink" x="430" y="307" font-size="13">lead hand same side;</text><text class="ink" x="430" y="324" font-size="13">gyaku-hanmi: opposite.</text><text class="ink" x="430" y="341" font-size="13">Same stance, mirrored</text><text class="ink" x="430" y="358" font-size="13">to the partner.</text></svg>