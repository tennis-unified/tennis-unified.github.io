<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 430" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7e3dd; stroke-width: 1.5; }
      .ptitle { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .psub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .foot { fill: #f1f5f9; stroke: #059669; stroke-width: 3; }
      .foot-toe { fill: #a7f3d0; stroke: #059669; stroke-width: 3; }
      .net { stroke: #94a3b8; stroke-width: 3.5; stroke-dasharray: 8 6; }
      .netlbl { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; text-anchor: middle; letter-spacing: .12em; }
      .power { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#ah-red); }
      .powerlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .switch { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#ah-purple); }
      .switchlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #7c3aed; text-anchor: middle; }
      .dim { stroke: #0369a1; stroke-width: 1.8; marker-end: url(#ah-blue); marker-start: url(#ah-blue); }
      .dimlbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .note { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #334155; }
      .h1 { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #1e293b; stroke: #334155; }
        .ptitle { fill: #34d399; }
        .psub { fill: #cbd5e1; }
        .foot { fill: #334155; stroke: #10b981; }
        .foot-toe { fill: #065f46; stroke: #10b981; }
        .net { stroke: #64748b; }
        .netlbl { fill: #64748b; }
        .powerlbl { fill: #f87171; }
        .switch { stroke: #a78bfa; }
        .switchlbl { fill: #a78bfa; }
        .dim { stroke: #38bdf8; }
        .dimlbl { fill: #38bdf8; }
        .note { fill: #e2e8f0; }
        .h1 { fill: #34d399; }
      }
    </style>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#dc2626"/></marker>
    <marker id="ah-purple" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#7c3aed"/></marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5,0 9" fill="#0369a1"/></marker>
    <g id="foot4">
      <rect class="foot" x="-13" y="-34" width="26" height="64" rx="11"/>
      <rect class="foot-toe" x="-13" y="-34" width="26" height="16" rx="8"/>
    </g>
  </defs>

  <text class="h1" x="475" y="24">Thế trung gian: NEUTRAL / SQUARE STANCE và các thế tập luyện · the transitional stance in both sports</text>

  <!-- LEFT: Tennis neutral/square -->
  <rect class="panel" x="10" y="40" width="440" height="270" rx="14"/>
  <text class="ptitle" x="230" y="66">TENNIS NEUTRAL (SQUARE) STANCE — Tư thế trung lập (vuông)</text>
  <line class="net" x1="30" y1="150" x2="430" y2="150"/>
  <text class="netlbl" x="230" y="142">NET · LƯỚI</text>
  <use href="#foot4" transform="translate(215,215) rotate(90)"/>
  <use href="#foot4" transform="translate(252,272) rotate(90)"/>
  <path class="switch" d="M 190 200 L 190 290"/>
  <path class="switch" d="M 285 290 L 285 200"/>
  <text class="switchlbl" x="230" y="320">chuyển trọng lượng trước ↔ sau</text>
  <text class="psub" x="230" y="342">Cả hai chân vuông góc 90° với lưới · forehand &amp; backhand đánh được từ đây</text>

  <!-- Right: MA training stance -->
  <rect class="panel" x="500" y="40" width="440" height="270" rx="14"/>
  <text class="ptitle" x="720" y="66">THẾ TẬP VÕ THUẬT — training / ready stance</text>
  <line class="dim" x1="560" y1="130" x2="880" y2="130"/>
  <text class="dimlbl" x="720" y="120">≈ rộng vai</text>
  <use href="#foot4" transform="translate(670,215)"/>
  <use href="#foot4" transform="translate(770,215)"/>
  <path class="power" d="M 720 175 L 720 150"/>
  <text class="powerlbl" x="720" y="140">đối phương</text>
  <text class="psub" x="720" y="272">Đinh tấn: “to teach musculo-skeletal alignment” · rèn cảm giác trọng tâm</text>
  <text class="psub" x="720" y="290">Ready position tennis: gối thụp, trọng tâm thấp — điểm khởi cho split step</text>

  <!-- Notes -->
  <g transform="translate(24,340)">
    <text class="note" x="0" y="14">✓ Neutral stance được dạy sớm vì nó “allows beginners to learn about shifting weight and rotation of the body” — đúng vai trò của các thế tập cơ bản trong võ thuật.</text>
    <text class="note" x="0" y="38">✓ Không phải thế phát lực: nó là bệ trung gian để chọn thế thật (open / closed / semi-open ↔ mã bộ / đinh tấn).</text>
    <text class="note" x="0" y="62">⚠ Bẫy thuật ngữ: tiếng Việt “trung bình tấn” nghĩa đen là “neutral stance” nhưng lại chỉ MÃ BỘ — đừng dùng nó để dịch tennis neutral stance.</text>
  </g>
  <text class="psub" x="475" y="420">The stance you learn in, not the one you win in — identical role in both sports</text>
</svg>
