<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="so-do-buoc-irimi-tenkan.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .uke{fill:#1e40af;stroke:#1e3a8a;stroke-width:2.5}
  .tori{fill:#fee2e2;stroke:#cf222e;stroke-width:2.5}
  .toriG{fill:none;stroke:#cf222e;stroke-width:2;stroke-dasharray:5 4}
  .axis{stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 4}
  .path{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#ah)}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .uke{fill:#1e3a8a;stroke:#60a5fa}
    .tori{fill:#542124;stroke:#ff7b72}
    .toriG{stroke:#ff7b72}
    .axis{stroke:#484f58}
    .path{stroke:#8b949e}
  }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="700">Aikido — Sơ đồ bước irimi &#8594; tenkan</text>
<text class="mut" x="24" y="56" font-size="12">tai-sabaki: nhập thân rồi xoay chuyển · nguồn: wikipedia - tenkan</text>

<rect class="panel" x="20" y="76" width="330" height="288" rx="10"/>
<line class="axis" x1="130" y1="96" x2="130" y2="352"/>
<text class="mut" x="118" y="104" font-size="10.5" transform="rotate(-90 118 104)">đường tấn công</text>

<text class="acc" x="40" y="120" font-size="11.5" font-weight="700">UKE — người tấn công</text>
<g transform="translate(112,140) rotate(90)"><ellipse class="uke" cx="0" cy="-24" rx="10" ry="15"/><ellipse class="uke" cx="0" cy="8" rx="8" ry="11"/></g>
<g transform="translate(158,150) rotate(90)"><ellipse class="uke" cx="0" cy="-24" rx="10" ry="15"/><ellipse class="uke" cx="0" cy="8" rx="8" ry="11"/></g>

<text class="acc2" x="40" y="330" font-size="11.5" font-weight="700">TORI — người thực hành</text>
<g transform="translate(112,318) rotate(-90)"><ellipse class="tori" cx="0" cy="-24" rx="10" ry="15"/><ellipse class="tori" cx="0" cy="8" rx="8" ry="11"/></g>
<g transform="translate(158,308) rotate(-90)"><ellipse class="tori" cx="0" cy="-24" rx="10" ry="15"/><ellipse class="tori" cx="0" cy="8" rx="8" ry="11"/></g>

<path class="path" d="M140,290 C210,270 236,236 236,206"/>
<circle class="toriG" cx="240" cy="200" r="15"/>
<text class="acc2" x="256" y="204" font-size="12" font-weight="700">1</text>
<g transform="translate(238,190) rotate(90)"><ellipse class="tori" cx="0" cy="-24" rx="10" ry="15"/><ellipse class="tori" cx="0" cy="8" rx="8" ry="11"/></g>
<path class="path" d="M250,182 C280,160 296,150 312,148"/>
<circle class="toriG" cx="316" cy="146" r="15"/>
<text class="acc2" x="332" y="150" font-size="12" font-weight="700">2</text>
<g transform="translate(318,140) rotate(-90)"><ellipse class="tori" cx="0" cy="-24" rx="10" ry="15"/><ellipse class="tori" cx="0" cy="8" rx="8" ry="11"/></g>

<rect class="panel" x="366" y="76" width="294" height="288" rx="10"/>
<text class="acc" x="382" y="102" font-size="13" font-weight="700">Hai bước, một nhịp</text>
<text class="mut" x="382" y="130" font-size="11.5">1 · IRIMI — bước thẳng vào,</text>
<text class="mut" x="382" y="148" font-size="11.5">ra khỏi đường tấn công tới</text>
<text class="mut" x="382" y="166" font-size="11.5">khe hở bên hông đối thủ.</text>
<text class="mut" x="382" y="196" font-size="11.5">2 · TENKAN — xoay trụ 180°</text>
<text class="mut" x="382" y="214" font-size="11.5">trên bàn chân đã chịu tải,</text>
<text class="mut" x="382" y="232" font-size="11.5">bàn chân kia bước ra thẳng.</text>
<text class="mut" x="382" y="262" font-size="11.5">Vòng tròn là đường thân thể vẽ —</text>
<text class="mut" x="382" y="280" font-size="11.5">đôi bàn chân chỉ đi hai đoạn thẳng.</text>
<text class="acc2" x="382" y="316" font-size="11.5" font-weight="700">Trên sân: bước vào chỗ bóng sẽ tới,</text>
<text class="acc2" x="382" y="334" font-size="11.5" font-weight="700">xoay trụ để quay về giữa sân.</text>
</svg>
