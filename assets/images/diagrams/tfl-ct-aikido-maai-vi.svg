<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="aikido-maai.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.5;fill:none}
  .dot{fill:#0969da}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="380"/><text class="ink" x="24" y="36" font-size="17" font-weight="700">Aikido — Ma-ai (khoảng cách &amp; thời điểm)</text><text class="mut" x="24" y="58" font-size="12">Nguồn: nishio yurusu budo</text><line class="lnb" x1="40" y1="180" x2="640" y2="180" stroke-width="3"/><line class="ln" x1="40" y1="170" x2="40" y2="190"/><text class="mut" x="40" y="210" font-size="12" text-anchor="middle">0</text><line class="ln" x1="240" y1="170" x2="240" y2="190"/><text class="mut" x="240" y="210" font-size="12" text-anchor="middle">1 tatami ~ 1,8 m</text><line class="ln" x1="440" y1="170" x2="440" y2="190"/><text class="mut" x="440" y="210" font-size="12" text-anchor="middle">2 tatami</text><line class="ln" x1="640" y1="170" x2="640" y2="190"/><text class="mut" x="640" y="210" font-size="12" text-anchor="middle">tiếp xúc</text><circle class="dot" cx="240" cy="180" r="8"/><text class="acc" x="240" y="240" font-size="13" font-weight="700" text-anchor="middle">ma-ai (khoảng an toàn)</text><text class="ink" x="40" y="300" font-size="13">Giữ khoảng cách để bạn có thể tấn công</text><text class="ink" x="40" y="317" font-size="13">mà không bị đánh. Ra đòn ngay khoảnh khắc</text><text class="ink" x="40" y="334" font-size="13">bạn diễn vào ma-ai của bạn; đừng để</text><text class="ink" x="40" y="351" font-size="13">nó tự khép lại. Khoảng cách = thời gian =</text><text class="ink" x="40" y="368" font-size="13">cửa sổ phục hồi cho động tác tiếp theo.</text></svg>