<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="ba-cach-thuc-hien-irimi.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .ft1{fill:#dbeafe;stroke:#0369a1;stroke-width:2.5}
  .ft2{fill:#e2e8f0;stroke:#64748b;stroke-width:2.5}
  .ghost{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 4}
  .arr{stroke:#cf222e;stroke-width:3;fill:none;marker-end:url(#ah)}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .ft1{fill:#12385e;stroke:#58a6ff}
    .ft2{fill:#21262d;stroke:#8b949e}
    .ghost{stroke:#484f58}
    .arr{stroke:#ff7b72}
  }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="700">Aikido — Ba cách thực hiện irimi (mỗi cách là một bước)</text>
<text class="mut" x="24" y="56" font-size="12">Nguồn: basic aikido stance and movements - katsujinken dojo</text>

<rect class="panel" x="20" y="76" width="208" height="250" rx="10"/>
<text class="acc" x="34" y="102" font-size="13" font-weight="700">TSUGI-ASHI · BƯỚC LƯỢT</text>
<text class="mut" x="34" y="120" font-size="10.5">chân trước di chuyển trước</text>
<g transform="translate(150,300) rotate(-90)"><ellipse class="ft1" cx="0" cy="-30" rx="11" ry="16"/><ellipse class="ft1" cx="0" cy="10" rx="8" ry="12"/></g>
<g transform="translate(108,232) rotate(-90)"><ellipse class="ft2" cx="0" cy="-30" rx="11" ry="16"/><ellipse class="ft2" cx="0" cy="10" rx="8" ry="12"/></g>
<path class="arr" d="M150,268 L150,212"/>
<path class="arr" d="M108,268 L112,244"/>
<text class="mut" x="34" y="318" font-size="10.5">Chân trước bước trước, chân sau</text>
<text class="mut" x="34" y="333" font-size="10.5">lượt theo — thế đứng không đổi.</text>

<rect class="panel" x="236" y="76" width="208" height="250" rx="10"/>
<text class="acc" x="250" y="102" font-size="13" font-weight="700">AYUMI-ASHI · BƯỚC ĐI</text>
<text class="mut" x="250" y="120" font-size="10.5">chân sau di chuyển trước</text>
<g transform="translate(158,300) rotate(-90)"><ellipse class="ft1" cx="0" cy="-30" rx="11" ry="16"/><ellipse class="ft1" cx="0" cy="10" rx="8" ry="12"/></g>
<g transform="translate(104,238) rotate(-90)"><ellipse class="ft2" cx="0" cy="-30" rx="11" ry="16"/><ellipse class="ft2" cx="0" cy="10" rx="8" ry="12"/></g>
<path class="arr" d="M104,272 L150,276"/>
<path class="arr" d="M158,262 L160,214"/>
<text class="mut" x="250" y="318" font-size="10.5">Chân sau vượt lên trước rồi chân</text>
<text class="mut" x="250" y="333" font-size="10.5">trước theo — thế đứng thay đổi.</text>

<rect class="panel" x="452" y="76" width="208" height="250" rx="10"/>
<text class="acc" x="466" y="102" font-size="13" font-weight="700">OKURI-ASHI · BƯỚC ĐƯA</text>
<text class="mut" x="466" y="120" font-size="10.5">bước chéo chân-vào-gót</text>
<g transform="translate(576,300) rotate(-90)"><ellipse class="ft1" cx="0" cy="-30" rx="11" ry="16"/><ellipse class="ft1" cx="0" cy="10" rx="8" ry="12"/></g>
<g transform="translate(520,238) rotate(-90)"><ellipse class="ft2" cx="0" cy="-30" rx="11" ry="16"/><ellipse class="ft2" cx="0" cy="10" rx="8" ry="12"/></g>
<path class="arr" d="M576,276 L572,240"/>
<path class="arr" d="M530,268 L548,290 L566,296"/>
<text class="mut" x="466" y="318" font-size="10.5">Chân sau đưa tới gót chân trước —</text>
<text class="mut" x="466" y="333" font-size="10.5">bước chéo, thế đứng giữ nguyên.</text>

<rect class="panel" x="20" y="338" width="640" height="46" rx="10"/>
<text class="mut" x="36" y="358" font-size="11.5">Cả ba đều là MỘT bước: trong mỗi sơ đồ, hai bàn chân đều di chuyển trong cùng một nhịp.</text>
<text class="mut" x="36" y="375" font-size="11.5">Mũi tên đỏ = hướng di chuyển. Xanh dương = chân tác động (trước), xám = chân trụ / theo sau.</text>
</svg>
