<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" role="img" aria-label="tfl-ss-sequence.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:2.6;fill:none}
  .piv{stroke:#0969da;stroke-width:2.6;fill:none}
  .dot{fill:#0969da}
  .gr{fill:#8c959f}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .piv{stroke:#58a6ff}
    .dot{fill:#58a6ff}
    .gr{fill:#6e7681}
  }
</style><rect class="bg" x="0" y="0" width="680" height="246"/><text class="ink" x="24" y="32" font-size="17" font-weight="700">Neutral to pivot to step - one pivot, one step</text><text class="mut" x="24" y="52" font-size="11.5">The pro split: read the direction mid-landing, so momentum is redirected, not re-created</text><rect class="panel" x="16" y="66" width="154" height="132" rx="10"/><rect class="panel" x="176" y="66" width="154" height="132" rx="10"/><rect class="panel" x="336" y="66" width="154" height="132" rx="10"/><rect class="panel" x="496" y="66" width="154" height="132" rx="10"/><text class="acc" x="93" y="88" font-size="11" font-weight="700" text-anchor="middle">1 Neutral lift</text><text class="acc" x="253" y="88" font-size="11" font-weight="700" text-anchor="middle">2 Read on way down</text><text class="acc" x="413" y="88" font-size="11" font-weight="700" text-anchor="middle">3 Plant the pivot</text><text class="acc" x="573" y="88" font-size="11" font-weight="700" text-anchor="middle">4 Step flows</text>

<circle class="lnb" cx="93" cy="118" r="8"/><path class="lnb" d="M93 126 L93 146"/><path class="ln" d="M93 132 L81 128"/><path class="ln" d="M93 132 L105 128"/><path class="lnb" d="M93 146 L93 172"/><line class="lnb" x1="86" y1="174" x2="100" y2="174"/><text class="mut" x="93" y="196" font-size="9.5" text-anchor="middle">chest, hips, feet square;</text>

<ellipse class="gr" cx="253" cy="186" rx="22" ry="4" opacity="0.5"/><circle class="lnb" cx="253" cy="116" r="8"/><path class="lnb" d="M253 124 L253 146"/><path class="ln" d="M253 130 L239 142"/><path class="ln" d="M253 130 L267 142"/><path class="lnb" d="M253 146 L243 160 L243 172"/><path class="lnb" d="M253 146 L263 160 L263 172"/><path class="gr" d="M300 140 l14 6 -14 6 z"/><text class="mut" x="253" y="196" font-size="9.5" text-anchor="middle">both options open; reading</text>

<circle class="lnb" cx="413" cy="116" r="8"/><path class="lnb" d="M413 124 L413 150"/><path class="ln" d="M413 130 L399 140"/><path class="ln" d="M413 130 L427 140"/><path class="piv" d="M413 150 L403 176"/><path class="dash" d="M393 172 a15 15 0 0 1 22 -6"/><path class="gr" d="M415 160 l-11 3 5 -9 z"/><path class="lnb" d="M413 150 L430 162 L436 156"/><text class="mut" x="413" y="196" font-size="9.5" text-anchor="middle">turn the foot + hip to aim</text>

<circle class="lnb" cx="575" cy="120" r="8"/><path class="lnb" d="M575 128 L569 152"/><path class="ln" d="M575 134 L561 140"/><path class="ln" d="M575 134 L589 126"/><path class="lnb" d="M569 152 L594 174"/><path class="lnb" d="M569 152 L549 162 L543 156"/><path class="gr" d="M604 158 l14 6 -14 6 z"/><text class="mut" x="573" y="196" font-size="9.5" text-anchor="middle">front foot places before</text>

<path class="gr" d="M170 132 l10 5 -10 5 z"/><path class="gr" d="M330 132 l10 5 -10 5 z"/><path class="gr" d="M490 132 l10 5 -10 5 z"/><text class="ink" x="16" y="222" font-size="11.5">Pivot foot = steering wheel for momentum; the step only places the foot. Never stop or reset between shots.</text><text class="mut" x="16" y="238" font-size="11">Aikido: this is moving from hanmi without a reset - the redirect, not the re-start, is the whole skill.</text></svg>
