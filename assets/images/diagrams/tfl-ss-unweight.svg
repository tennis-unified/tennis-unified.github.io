<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="tfl-ss-unweight.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .panelB{fill:#fff5f5;stroke:#cf222e;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .acc2{fill:#cf222e}
  .ok{fill:#1a7f37}
  .ln{stroke:#57606a;stroke-width:2;fill:none}
  .lnb{stroke:#1f2328;stroke-width:3;fill:none}
  .dot{fill:#0969da}
  .sup{stroke:#0969da;stroke-width:3.5;fill:none}
  .dash{stroke:#57606a;stroke-width:2;fill:none;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .panelB{fill:#2d1416;stroke:#ff7b72}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .acc2{fill:#ff7b72}
    .ok{fill:#3fb950}
    .ln{stroke:#8b949e}
    .lnb{stroke:#e6edf3}
    .dot{fill:#58a6ff}
    .sup{stroke:#58a6ff}
    .dash{stroke:#8b949e}
  }
</style><rect class="bg" x="0" y="0" width="680" height="320"/><text class="ink" x="24" y="34" font-size="17" font-weight="700">Unweight - free the foot that has to step</text><text class="mut" x="24" y="55" font-size="12">Stay on the balls of the feet, so neither foot is stuck to the court</text><rect class="panel" x="20" y="70" width="410" height="196" rx="10"/><text class="acc" x="34" y="92" font-size="12" font-weight="700">Split landing mid-air-dip</text><line class="ln" x1="36" y1="228" x2="414" y2="228"/>

<circle class="lnb" cx="196" cy="128" r="11"/><path class="lnb" d="M196 139 L196 178"/><path class="ln" d="M196 148 L180 168"/><path class="ln" d="M196 148 L214 164"/><path class="sup" d="M196 178 L196 222"/><circle class="dot" cx="196" cy="224" r="5"/><path class="dash" d="M196 178 L262 196 L272 184"/><circle class="mut" cx="196" cy="150" r="0" fill="#57606a"/><circle cx="196" cy="152" r="4" fill="#cf222e" opacity="0"/><circle cx="200" cy="150" r="4.5" fill="#57606a"/><path class="dash" d="M200 150 L200 206"/><text class="acc" x="150" y="252" font-size="11" font-weight="700">LOADED leg = root</text><text class="mut" x="248" y="176" font-size="11" font-weight="700">UNWEIGHTED foot</text><text class="mut" x="248" y="190" font-size="10.5">floats, free to step</text>

<rect class="panel" x="446" y="70" width="212" height="80" rx="10"/><text class="ok" x="458" y="90" font-size="12" font-weight="700">Good - unweighted</text><text class="mut" x="458" y="108" font-size="10.5">Weight on one foot, the other light:</text><text class="mut" x="458" y="122" font-size="10.5">either foot can drive at once.</text><text class="mut" x="458" y="136" font-size="10.5">No unload step first.</text><rect class="panelB" x="446" y="160" width="212" height="106" rx="10"/><text class="acc2" x="458" y="180" font-size="12" font-weight="700">Fault - flat / double-loaded</text><text class="mut" x="458" y="198" font-size="10.5">Both heels down, weight even:</text><text class="mut" x="458" y="212" font-size="10.5">the stepping foot is stuck.</text><text class="mut" x="458" y="226" font-size="10.5">You must shift weight off before</text><text class="mut" x="458" y="240" font-size="10.5">you move = two extra moves.</text>

<text class="ink" x="24" y="296" font-size="12" font-weight="700">In martial terms</text><text class="mut" x="118" y="296" font-size="11.5">Taichi xu-shi: one foot full, one foot held empty and alive - and never double-weighted, the same failure the flat landing causes.</text></svg>
