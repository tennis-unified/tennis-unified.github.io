<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="tenkan-va-tentai.svg"><style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .bg{fill:#ffffff}
  .panel{fill:#f4f6f8;stroke:#d0d7de;stroke-width:1.5}
  .ink{fill:#1f2328}
  .mut{fill:#57606a}
  .acc{fill:#0969da}
  .ft1{fill:#dbeafe;stroke:#0369a1;stroke-width:2.5}
  .ft2{fill:#e2e8f0;stroke:#64748b;stroke-width:2.5}
  .arr{stroke:#cf222e;stroke-width:3;fill:none;marker-end:url(#ah)}
  .arc{stroke:#0969da;stroke-width:3;fill:none;stroke-dasharray:6 5;marker-end:url(#ahb)}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d}
    .ink{fill:#e6edf3}
    .mut{fill:#8b949e}
    .acc{fill:#58a6ff}
    .ft1{fill:#12385e;stroke:#58a6ff}
    .ft2{fill:#21262d;stroke:#8b949e}
    .arr{stroke:#ff7b72}
    .arc{stroke:#58a6ff}
  }
</style>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/></marker>
  <marker id="ahb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0969da"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="700">Aikido — Yếu tố của Tenkan và Tentai</text>
<text class="mut" x="24" y="56" font-size="12">enten no ri — nguyên lý quay cầu · nguồn: katsujinken dojo</text>

<rect class="panel" x="20" y="76" width="310" height="250" rx="10"/>
<text class="acc" x="36" y="102" font-size="13" font-weight="700">TENKAN — xoay 180° trên chân trước</text>
<circle class="ft1" cx="130" cy="180" r="10"/>
<path class="arc" d="M130,180 A72 72 0 0 1 202,252"/>
<g transform="translate(240,300) rotate(-60)"><ellipse class="ft2" cx="0" cy="-26" rx="10" ry="15"/><ellipse class="ft2" cx="0" cy="9" rx="8" ry="11"/></g>
<path class="arr" d="M232,252 L204,288"/>
<text class="mut" x="36" y="140" font-size="10.5">a · trung tâm cố định (chân trụ)</text>
<text class="mut" x="36" y="158" font-size="10.5">b · bán kính quay = chân bước</text>
<text class="mut" x="36" y="176" font-size="10.5">c · thế tam giác được giữ</text>
<text class="mut" x="36" y="194" font-size="10.5">d · mục tiêu: thoát khỏi đường tấn công</text>
<text class="mut" x="36" y="212" font-size="10.5">e · đổi cả thân thể (tai-no-henko)</text>
<text class="acc" x="36" y="318" font-size="11.5" font-weight="700">Chân chính xoay tại chỗ — chân kia bước thẳng.</text>

<rect class="panel" x="350" y="76" width="310" height="250" rx="10"/>
<text class="acc" x="366" y="102" font-size="13" font-weight="700">TENTAI — chuyển trọng tâm sang bên</text>
<circle class="ft1" cx="470" cy="180" r="10"/>
<path class="arc" d="M470,180 A60 60 0 0 0 530,240"/>
<g transform="translate(540,300) rotate(-60)"><ellipse class="ft2" cx="0" cy="-26" rx="10" ry="15"/><ellipse class="ft2" cx="0" cy="9" rx="8" ry="11"/></g>
<path class="arr" d="M540,262 L532,290"/>
<text class="mut" x="366" y="140" font-size="10.5">a · trung tâm quay (chân trụ dịch chuyển)</text>
<text class="mut" x="366" y="158" font-size="10.5">b · thế tam giác được giữ</text>
<text class="mut" x="366" y="176" font-size="10.5">c · bệ gan bàn chân, đầu gối cong để chuyển trọng tâm</text>
<text class="mut" x="366" y="194" font-size="10.5">d · mục tiêu: thoát khỏi đường tấn công</text>
<text class="mut" x="366" y="212" font-size="10.5">e · đổi cả thân thể (tai-no-henko)</text>
<text class="acc" x="366" y="318" font-size="11.5" font-weight="700">Cả hai đều xoay trên bệ gan bàn chân, không trượt gót.</text>

<rect class="panel" x="20" y="338" width="640" height="46" rx="10"/>
<text class="mut" x="36" y="358" font-size="11.5">Điểm chung: bệ gan bàn chân làm trục quay, đầu gối cong để dịch trọng tâm —</text>
<text class="mut" x="36" y="375" font-size="11.5">trọng lượng nằm trên chân đã chịu tải (chân đầy), đúng quy tắc Thái Cực: xoay trên một chân, đừng trượt trên hai.</text>
</svg>
