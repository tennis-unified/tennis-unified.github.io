name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prune non-site and oversized files from Pages staging
        run: |
          echo "=== Before prune ==="
          du -sh .
          du -sh assets/* 2>/dev/null | sort -hr | head -n 10
          rm -rf raw-intel workspace docs_src synthesis-log reports research \
            "Tenniskb-5 Pillars" "Tenniskb-10 Pillars" scripts tenniskb \
            hi-tech-tennis-archive gemini-notebooks _batch_*.json *.py *.php
          BYTES=$(du -sb --exclude=.git . | awk '{print $1}')
          echo "After non-site prune: $BYTES bytes"
          if [ "$BYTES" -ge 9000000000 ]; then
            echo "Pruning assets/pdfs, vi/books/*.pdf, and media archives..."
            rm -rf assets/pdfs
            rm -f vi/books/*.pdf books/*.pdf
            find . -maxdepth 6 \( -name '*.mp4' -o -name '*.zip' -o -name '*.wav' -o -name '*.mov' \) -delete
            BYTES=$(du -sb --exclude=.git . | awk '{print $1}')
            echo "After PDF/media prune: $BYTES bytes"
          fi
          if [ "$BYTES" -ge 9000000000 ]; then
            echo "Pruning files > 2MB in assets/images to stay under 9GB..."
            find assets/images -type f -size +2M -delete 2>/dev/null || true
            BYTES=$(du -sb --exclude=.git . | awk '{print $1}')
            echo "After >2MB assets/images prune: $BYTES bytes"
          fi
          if [ "$BYTES" -ge 9000000000 ]; then
            echo "Pruning files > 500k in assets/images to stay under 9GB..."
            find assets/images -type f -size +500k -delete 2>/dev/null || true
            BYTES=$(du -sb --exclude=.git . | awk '{print $1}')
            echo "Final staged size: $BYTES bytes"
          fi
          du -sh .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Wait for artifact propagation
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 30
